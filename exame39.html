<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exame 39 - Simulado OAB</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px}
  .box{max-width:650px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  h1{color:#1a365d;text-align:center;margin:5px 0 2px;font-size:24px}
  .sub{text-align:center;color:#64748b;margin-bottom:15px}
  .top{display:flex;justify-content:space-between;background:#e2e8f0;padding:10px 12px;border-radius:10px;font-weight:bold;font-size:14px}
  .pergunta{font-size:18px;line-height:1.5;margin:18px 0 12px;color:#1e293b}
  .opcao{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:13px;margin-bottom:10px;font-size:16px;cursor:pointer}
  .opcao.selecionada{background:#dbeafe;border-color:#2563eb}
  .opcao.certa{background:#dcfce7!important;border-color:#16a34a!important}
  .opcao.errada{background:#fee2e2!important;border-color:#dc2626!important}
  button#prox{width:100%;background:#1a365d;color:#fff;border:0;padding:15px;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:5px}
  button#prox:disabled{opacity:.5}
  .resultado{text-align:center}
  .nota{font-size:48px;font-weight:bold;color:#1a365d;margin:10px 0}
  .aviso{background:#fffbeb;border:1px solid #fcd34d;padding:10px;border-radius:10px;font-size:13px;color:#92400e;margin-top:15px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>Exame 39 - Simulado OAB</h1>
  <p class="sub">Simulado para treinar - 80 questões</p>

  <div id="tela-jogo">
    <div class="top">
      <span id="contador">Questão 1 de 80</span>
      <span id="placar">Acertos: 0</span>
    </div>
    <p class="pergunta" id="texto-pergunta"></p>
    <div id="opcoes"></div>
    <button id="prox" disabled>Próxima →</button>
    <div class="aviso">⚠️ SIMULADO para testar o site. Ainda NÃO são as 80 oficiais da FGV. Vamos trocar depois.</div>
  </div>

  <div id="tela-fim" class="resultado" style="display:none">
    <h2>Fim do simulado! 🎉</h2>
    <div class="nota" id="nota-final"></div>
    <p id="mensagem-final"></p>
    <button id="prox" onclick="location.reload()" style="width:100%;background:#1a365d;color:#fff;border:0;padding:15px;border-radius:12px;font-size:17px;font-weight:bold">Fazer de novo</button>
  </div>
</div>

<script>
const materias = ["Ética Profissional","Direito Constitucional","Direito Civil","Direito Penal","Direito Processual Civil","Direito do Trabalho","Direito Tributário","Direito Administrativo"];
const questoes = [];
for(let i=1;i<=80;i++){
  const m = materias[i % materias.length];
  questoes.push({
    pergunta: `Questão ${i} - ${m}: (SIMULADO) Qual alternativa está correta conforme a legislação e entendimento majoritário sobre ${m}?`,
    opcoes: [
      `Alternativa A - Conceito geral de ${m}`,
      `Alternativa B - Regra correta de ${m} - RESPOSTA CORRETA DO SIMULADO`,
      `Alternativa C - Exceção que não se aplica a ${m}`,
      `Alternativa D - Entendimento superado sobre ${m}`
    ],
    correta: 1
  });
}

let atual = 0, acertos = 0, selecionada = -1, respondeu = false;

function mostrar(){
  const q = questoes[atual];
  document.getElementById('contador').innerText = `Questão ${atual+1} de 80`;
  document.getElementById('placar').innerText = `Acertos: ${acertos}`;
  document.getElementById('texto-pergunta').innerText = q.pergunta;
  const div = document.getElementById('opcoes');
  div.innerHTML = '';
  selecionada = -1; respondeu = false;
  document.getElementById('prox').disabled = true;
  document.getElementById('prox').innerText = atual === 79 ? 'Ver resultado' : 'Próxima →';
  q.opcoes.forEach((txt, idx)=>{
    const b = document.createElement('button');
    b.className = 'opcao'; b.innerText = txt;
    b.onclick = ()=>{
      if(respondeu) return;
      respondeu = true; selecionada = idx;
      document.querySelectorAll('.opcao').forEach((el,j)=>{
        if(j===q.correta) el.classList.add('certa');
        else if(j===idx) el.classList.add('errada');
      });
      if(idx===q.correta) acertos++;
      document.getElementById('placar').innerText = `Acertos: ${acertos}`;
      document.getElementById('prox').disabled = false;
    };
    div.appendChild(b);
  });
}
document.getElementById('prox').onclick = ()=>{
  if(atual < 79){ atual++; mostrar(); }
  else{
    document.getElementById('tela-jogo').style.display='none';
    document.getElementById('tela-fim').style.display='block';
    document.getElementById('nota-final').innerText = `${acertos} / 80`;
    document.getElementById('mensagem-final').innerText = acertos>=40 ? 'Você passou! Parabéns! 🎉' : 'Continue treinando, você consegue! 💪';
  }
};
mostrar();
</script>
</body>
</html>
