39:{q:"39 - Sobre recursos no CPC, assinale a correta.",a:"A) Apelação é contra sentença.",b:"B) Agravo de instrumento contra decisões interlocutórias.",c:"C) Embargos de declaração para obscuridade, contradição, omissão.",d:"D) Todas as alternativas estão corretas.",g:3},
40:{q:"40 - Sobre os recursos no CPC, assinale a correta.",a:"A) O recurso deve ser interposto no prazo legal.",b:"B) O preparo é requisito de admissibilidade.",c:"C) A apelação é o recurso cabível contra sentença.",d:"D) A apelação é o recurso cabível contra sentença, devolvendo a matéria ao tribunal.",g:2},
41:{q:"Sobre os direitos fundamentais previstos na CF/88, assinale a correta.",a:"A) A casa é asilo inviolável, nela ninguém podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial.",b:"B) É livre a manifestação do pensamento, sendo permitido o anonimato.",c:"C) A prática do racismo constitui crime afiançável e prescritível.",d:"D) Ninguém será considerado culpado até o trânsito em julgado de sentença penal condenatória, salvo nos crimes hediondos.",g:0},
42:{q:"Sobre a nacionalidade na CF/88, assinale a correta.",a:"A) São brasileiros natos os nascidos no estrangeiro de pai brasileiro ou mãe brasileira, desde que qualquer deles esteja a serviço do Brasil.",b:"B) São brasileiros naturalizados os estrangeiros de qualquer nacionalidade residentes no Brasil há mais de 10 anos ininterruptos e sem condenação penal.",c:"C) O brasileiro nato nunca perderá a nacionalidade.",d:"D) A lei não poderá estabelecer distinção entre brasileiros natos e naturalizados, salvo nos casos previstos na Constituição.",g:3},
43:{q:"Sobre o Poder Legislativo, assinale a correta.",a:"A) A Câmara dos Deputados compõe-se de representantes do povo, eleitos pelo sistema proporcional, em cada Estado, em cada Território e no Distrito Federal.",b:"B) O Senado Federal compõe-se de representantes dos Estados e do Distrito Federal, eleitos segundo o princípio majoritário.",c:"C) Cada Estado e o Distrito Federal elegerão três Senadores, com mandato de oito anos.",d:"D) Todas as alternativas estão corretas.",g:3},
44:{q:"Sobre o controle de constitucionalidade, assinale a correta.",a:"A) O controle difuso é exercido por qualquer juiz ou tribunal no caso concreto.",b:"B) O controle concentrado é exercido exclusivamente pelo STF, por meio da ADI, ADC e ADPF.",c:"C) Na ADI, a decisão tem efeitos erga omnes e ex tunc, em regra.",d:"D) Todas as alternativas estão corretas.",g:3},
45:{q:"Sobre os atos administrativos, assinale a correta.",a:"A) A revogação é a extinção do ato por vício de legalidade.",b:"B) A anulação é a extinção do ato por conveniência e oportunidade.",c:"C) A revogação pode ser feita pela própria Administração, por motivos de conveniência e oportunidade, respeitados os direitos adquiridos.",d:"D) O ato discricionário não admite controle judicial.",g:2},
46:{q:"Sobre licitação e contratos administrativos (Lei 14.133/21), assinale a correta.",a:"A) A licitação é dispensável em todos os casos de emergência.",b:"B) São modalidades de licitação: pregão, concorrência, concurso, leilão e diálogo competitivo.",c:"C) O pregão é obrigatório para aquisição de bens e serviços comuns.",d:"D) As alternativas B e C estão corretas.",g:3},
47:{q:"Sobre responsabilidade civil do Estado, assinale a correta.",a:"A) A responsabilidade do Estado por atos comissivos é objetiva, baseada na teoria do risco administrativo.",b:"B) A responsabilidade por omissão é sempre subjetiva, exigindo comprovação de culpa.",c:"C) O Estado responde pelos danos que seus agentes causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.",d:"D) Todas as alternativas estão corretas.",g:3},
48:{q:"Sobre os contratos no Código Civil, assinale a correta.",a:"A) A proposta de contrato obriga o proponente, se o contrário não resultar dos termos dela, da natureza do negócio ou das circunstâncias do caso.",b:"B) O contrato de adesão não admite interpretação favorável ao aderente.",c:"C) A liberdade de contratar é absoluta, sem limites.",d:"D) O contrato só se aperfeiçoa com a entrega da coisa.",g:0},
49:{q:"Sobre a posse no Código Civil, assinale a correta.",a:"A) Considera-se possuidor todo aquele que tem de fato o exercício, pleno ou não, de algum dos poderes inerentes à propriedade.",b:"B) A posse direta anula a posse indireta.",c:"C) O possuidor de má-fé tem direito aos frutos colhidos.",d:"D) A posse não pode ser transmitida aos herdeiros.",g:0},
50:{q:"Sobre usucapião, assinale a correta.",a:"A) A usucapião extraordinária exige 15 anos de posse mansa, pacífica e ininterrupta, independentemente de justo título e boa-fé.",b:"B) A usucapião ordinária exige 10 anos, com justo título e boa-fé.",c:"C) O prazo da usucapião extraordinária pode ser reduzido para 10 anos se o possuidor houver estabelecido no imóvel sua moradia habitual ou realizado obras de caráter produtivo.",d:"D) Todas as alternativas estão corretas.",g:3},
51:{q:"Sobre o casamento no Código Civil, assinale a correta.",a:"A) O casamento é civil e gratuita a sua celebração.",b:"B) A idade mínima para casar é 18 anos, sem exceções.",c:"C) O casamento religioso não tem efeito civil.",d:"D) É proibido o casamento entre ascendentes e descendentes, apenas na linha reta.",g:0},
52:{q:"Sobre o poder familiar, assinale a correta.",a:"A) O poder familiar será exercido em igualdade de condições pelo pai e pela mãe.",b:"B) A falta ou impedimento de um dos pais transfere o exercício exclusivo ao outro.",c:"C) O filho menor pode ser colocado em família substituta apenas por decisão judicial.",d:"D) Todas as alternativas estão corretas.",g:3},
53:{q:"Sobre a sucessão legítima, assinale a correta.",a:"A) A sucessão legítima defere-se na ordem: descendentes, ascendentes, cônjuge sobrevivente, colaterais.",b:"B) Havendo descendentes, o cônjuge sobrevivente concorre com eles, salvo no regime da comunhão universal.",c:"C) Os herdeiros necessários são os descendentes, ascendentes e o cônjuge.",d:"D) Todas as alternativas estão corretas.",g:3},
54:{q:"Sobre o crime de furto (art. 155, CP), assinale a correta.",a:"A) Subtrair, para si ou para outrem, coisa alheia móvel.",b:"B) A pena é aumentada se o crime é praticado durante o repouso noturno.",c:"C) Se o criminoso é primário e a coisa é de pequeno valor, o juiz pode substituir a pena de reclusão por detenção, diminuí-la de um a dois terços, ou aplicar somente pena de multa.",d:"D) Todas as alternativas estão corretas.",g:3},
55:{q:"Sobre o crime de roubo (art. 157, CP), assinale a correta.",a:"A) Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou violência à pessoa, ou depois de havê-la, por qualquer meio, reduzido à impossibilidade de resistência.",b:"B) A pena é aumentada se a violência resulta em lesão corporal grave.",c:"C) Se resulta morte, a pena é de reclusão de 20 a 30 anos.",d:"D) Todas as alternativas estão corretas.",g:3},
56:{q:"Sobre a legítima defesa, assinale a correta.",a:"A) Entende-se em legítima defesa quem, usando moderadamente dos meios necessários, repele injusta agressão, atual ou iminente, a direito seu ou de outrem.",b:"B) A legítima defesa não se aplica para defender patrimônio.",c:"C) O excesso doloso na legítima defesa é impunível.",d:"D) A legítima defesa putativa não exclui a ilicitude.",g:0},
57:{q:"Sobre o Tribunal do Júri, assinale a correta.",a:"A) Compete ao Tribunal do Júri julgar os crimes dolosos contra a vida.",b:"B) São princípios do Júri: plenitude de defesa, sigilo das votações, soberania dos veredictos e competência mínima.",c:"C) O Júri é composto por 7 jurados sorteados.",d:"D) Todas as alternativas estão corretas, exceto a B.",g:3},
58:{q:"Sobre a prescrição penal, assinale a correta.",a:"A) A prescrição é a perda do direito de punir do Estado pelo decurso do tempo.",b:"B) A prescrição da pretensão punitiva ocorre antes do trânsito em julgado.",c:"C) A prescrição da pretensão executória ocorre após o trânsito em julgado.",d:"D) Todas as alternativas estão corretas.",g:3},
59:{q:"Sobre o Direito do Trabalho, assinale a correta.",a:"A) Considera-se empregado toda pessoa física que prestar serviços de natureza não eventual a empregador, sob a dependência deste e mediante salário.",b:"B) A jornada normal de trabalho é de 8 horas diárias e 44 semanais.",c:"C) O contrato de trabalho por prazo determinado não pode ser estipulado por mais de 2 anos.",d:"D) Todas as alternativas estão corretas.",g:3},
60:{q:"Sobre o aviso prévio, assinale a correta.",a:"A) O aviso prévio proporcional ao tempo de serviço é de no mínimo 30 dias, acrescidos de 3 dias por ano de serviço prestado na mesma empresa, até o máximo de 60 dias, totalizando até 90 dias.",b:"B) A falta de aviso prévio por parte do empregador dá ao empregado o direito aos salários correspondentes.",c:"C) O aviso prévio trabalhado tem redução de 2 horas diárias ou 7 dias corridos.",d:"D) Todas as alternativas estão corretas.",g:3},
61:{q:"Sobre o contrato individual de trabalho, assinale a correta.",a:"A) O contrato individual de trabalho é o acordo tácito ou expresso, correspondente à relação de emprego.",b:"B) O contrato por prazo determinado só é válido em se tratando de serviço cuja natureza justifique a predeterminação do prazo.",c:"C) O contrato de experiência não poderá exceder 90 dias.",d:"D) Todas as alternativas estão corretas.",g:3},
62:{q:"Sobre as férias no Direito do Trabalho, assinale a correta.",a:"A) Todo empregado terá direito anualmente ao gozo de um período de férias, sem prejuízo da remuneração.",b:"B) Após cada período de 12 meses de vigência do contrato, o empregado terá direito a férias de 30 dias.",c:"C) As férias podem ser divididas em até 3 períodos, sendo um deles de no mínimo 14 dias.",d:"D) Todas as alternativas estão corretas.",g:3},
63:{q:"Sobre o Direito Tributário, assinale a correta.",a:"A) Tributo é toda prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito.",b:"B) São espécies de tributo: impostos, taxas e contribuições de melhoria.",c:"C) O imposto é tributo cuja obrigação tem por fato gerador uma situação independente de qualquer atividade estatal específica.",d:"D) Todas as alternativas estão corretas.",g:3},
64:{q:"Sobre os princípios tributários, assinale a correta.",a:"A) Pelo princípio da legalidade, nenhum tributo será exigido ou aumentado sem lei que o estabeleça.",b:"B) Pelo princípio da anterioridade, é vedado cobrar tributo no mesmo exercício financeiro em que haja sido publicada a lei que o instituiu ou aumentou.",c:"C) Pelo princípio da noventena, é vedado cobrar tributo antes de decorridos 90 dias da publicação da lei.",d:"D) Todas as alternativas estão corretas.",g:3},
65:{q:"Sobre o Direito do Consumidor, assinale a correta.",a:"A) Consumidor é toda pessoa física ou jurídica que adquire ou utiliza produto ou serviço como destinatário final.",b:"B) Fornecedor é toda pessoa física ou jurídica que desenvolve atividade de produção, montagem, criação, construção, transformação, importação, exportação, distribuição ou comercialização de produtos ou prestação de serviços.",c:"C) A inversão do ônus da prova pode ser determinada quando for verossímil a alegação ou quando o consumidor for hipossuficiente.",d:"D) Todas as alternativas estão corretas.",g:3},
66:{q:"Sobre o Direito Ambiental, assinale a correta.",a:"A) Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo e essencial à sadia qualidade de vida.",b:"B) O poluidor é obrigado a reparar os danos causados, independentemente de culpa.",c:"C) A responsabilidade civil ambiental é objetiva.",d:"D) Todas as alternativas estão corretas.",g:3},
67:{q:"Sobre o Estatuto da Criança e do Adolescente, assinale a correta.",a:"A) Considera-se criança a pessoa até 12 anos incompletos, e adolescente aquela entre 12 e 18 anos.",b:"B) É dever da família, da comunidade, da sociedade em geral e do poder público assegurar os direitos fundamentais da criança e do adolescente.",c:"C) O ato infracional praticado por criança corresponde a medida de proteção, não a medida socioeducativa.",d:"D) Todas as alternativas estão corretas.",g:3},
68:{q:"Sobre o Direito Empresarial, assinale a correta.",a:"A) Considera-se empresário quem exerce profissionalmente atividade econômica organizada para a produção ou circulação de bens ou serviços.",b:"B) Não se considera empresário quem exerce profissão intelectual, de natureza científica, literária ou artística.",c:"C) A empresa individual de responsabilidade limitada foi substituída pela sociedade limitada unipessoal.",d:"D) Todas as alternativas estão corretas.",g:3},
69:{q:"Sobre os títulos de crédito, assinale a correta.",a:"A) O título de crédito é documento necessário ao exercício do direito literal e autônomo nele contido.",b:"B) A letra de câmbio é ordem de pagamento.",c:"C) A nota promissória é promessa de pagamento.",d:"D) Todas as alternativas estão corretas.",g:3},
70:{q:"Sobre a Lei de Introdução às Normas do Direito Brasileiro, assinale a correta.",a:"A) A lei em vigor terá efeito imediato e geral, respeitados o ato jurídico perfeito, o direito adquirido e a coisa julgada.",b:"B) Não se destinando à vigência temporária, a lei terá vigor até que outra a modifique ou revogue.",c:"C) A revogação pode ser expressa ou tácita.",d:"D) Todas as alternativas estão corretas.",g:3},
71:{q:"Sobre a prova no Processo Civil, assinale a correta.",a:"A) O ônus da prova incumbe ao autor quanto ao fato constitutivo de seu direito, e ao réu quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor.",b:"B) O juiz pode distribuir o ônus da prova de modo diverso, quando for excessivamente difícil o cumprimento do encargo.",c:"C) São meios de prova: depoimento pessoal, confissão, exibição de documento, prova documental, testemunhal e pericial.",d:"D) Todas as alternativas estão corretas.",g:3},
72:{q:"Sobre a sentença no CPC, assinale a correta.",a:"A) A sentença é o pronunciamento por meio do qual o juiz põe fim à fase cognitiva do procedimento comum.",b:"B) A sentença deve ser certa, ainda que resolva relação jurídica condicional.",c:"C) A sentença que julgar total ou parcialmente a lide terá força de lei nos limites da questão principal expressamente decidida.",d:"D) Todas as alternativas estão corretas, exceto a B.",g:3},
73:{q:"Sobre a ação de usucapião, assinale a correta.",a:"A) A usucapião pode ser pleiteada pela via judicial ou extrajudicial.",b:"B) A usucapião extrajudicial é processada no cartório de registro de imóveis.",c:"C) O possuidor pode, para fim de contar o tempo exigido, acrescentar à sua posse a dos seus antecessores.",d:"D) Todas as alternativas estão corretas.",g:3},
74:{q:"Sobre o habeas corpus, assinale a correta.",a:"A) Conceder-se-á habeas corpus sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder.",b:"B) O habeas corpus é gratuito.",c:"C) Pode ser impetrado por qualquer pessoa, em seu favor ou de outrem.",d:"D) Todas as alternativas estão corretas.",g:3},
75:{q:"Sobre o mandado de segurança, assinale a correta.",a:"A) Conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data.",b:"B) O prazo para impetrar mandado de segurança é de 120 dias, contados da ciência do ato impugnado.",c:"C) O mandado de segurança coletivo pode ser impetrado por partido político com representação no Congresso Nacional.",d:"D) Todas as alternativas estão corretas.",g:3},
76:{q:"Sobre a Ética Profissional do Advogado (EOAB), assinale a correta.",a:"A) O advogado deve agir com decoro, boa-fé e lealdade.",b:"B) É vedado ao advogado angariar ou captar causas, com ou sem a intervenção de terceiros.",c:"C) O advogado não pode aceitar procuração de quem já tenha patrono constituído, sem prévio conhecimento deste.",d:"D) Todas as alternativas estão corretas.",g:3},
77:{q:"Sobre os honorários advocatícios, assinale a correta.",a:"A) Os honorários de sucumbência são fixados entre 10% e 20% sobre o valor da condenação.",b:"B) A verba de sucumbência é direito do advogado.",c:"C) Os honorários contratuais podem ser pactuados livremente, respeitados os limites éticos.",d:"D) Todas as alternativas estão corretas.",g:3},
78:{q:"Sobre a OAB, assinale a correta.",a:"A) Compete à OAB representar e defender os interesses da classe dos advogados.",b:"B) A OAB tem personalidade jurídica própria e não mantém vínculo funcional com a Administração.",c:"C) O Conselho Federal é o órgão supremo da OAB.",d:"D) Todas as alternativas estão corretas.",g:3},
79:{q:"Sobre o Código de Ética e Disciplina da OAB, assinale a correta.",a:"A) O advogado deve manter independência em qualquer circunstância.",b:"B) É dever do advogado guardar sigilo profissional.",c:"C) O advogado deve recusar-se a depor como testemunha sobre fatos que constituam sigilo profissional.",d:"D) Todas as alternativas estão corretas.",g:3},
80:{q:"Sobre os direitos do advogado (art. 7º, EOAB), assinale a correta.",a:"A) É direito do advogado exercer, com liberdade, a profissão em todo o território nacional.",b:"B) É direito do advogado ter vista dos processos e examinar autos, mesmo sem procuração, em cartório ou secretaria.",c:"C) É direito do advogado comunicar-se com seu cliente, pessoal e reservadamente, mesmo sem procuração, quando preso, detido ou recolhido.",d:"D) Todas as alternativas estão corretas.",g:3}
};
let idx=0, score=0, sel=null;
function show(){
  const t=TEXTOS[idx+1];
  document.getElementById('q').innerHTML='<h2>'+t.q+'</h2>';
  const keys=['a','b','c','d'];
  document.getElementById('opts').innerHTML=keys.map((k,i)=>'<button onclick="sel='+i+';this.style.background=\'#d9f99d\'">'+t[k]+'</button>').join('');
  document.getElementById('result').innerHTML='Questão '+(idx+1)+' de 80 | Acertos: '+score;
}
function nextQ(){
  if(sel===null){alert('Escolha uma alternativa');return;}
  if(sel===TEXTOS[idx+1].g) score++;
  sel=null; idx++;
  if(idx>=80){document.getElementById('q').innerHTML='<h2>Fim! Você acertou '+score+' de 80</h2>';document.getElementById('opts').innerHTML='';document.getElementById('next').style.display='none';document.getElementById('result').innerHTML='Nota: '+(score*100/80).toFixed(1)+'%';return;}
  show();
}
show();
</script>
