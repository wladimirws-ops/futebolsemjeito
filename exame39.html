<style>

<body>
<div class="top"><a href="index.html">← VOLTAR</a><div id="timer">05:00:00</div></div>

</div>
<script>
const G=["A","D","D","C","A","D","B","A","D","D","C","B","A","C","A","B","B","C","A","C","B","A","C","A","C","D","A","D","C","D","A","D","C","A","B","C","C","D","B","D","C","D","B","B","C","B","A","B","D","A","B","D","C","D","D","D","A","B","B","B","D","A","C","C","D","A","A","C","C","B","D","B","B","A","B","C","B","A","A","C"];
const M=["Ética","Ética","Ética","Ética","Ética","Ética","Ética","Ética","Filosofia","Filosofia","Constitucional","Constitucional","Constitucional","Constitucional","Constitucional","Constitucional","Constitucional","Direitos Humanos","Direitos Humanos","Internacional","Internacional","Tributário","Tributário","Administrativo","Administrativo","Ambiental","Ambiental","Civil","Civil","Civil","Civil","Civil","Civil","Proc. Civil","Proc. Civil","Proc. Civil","Proc. Civil","Proc. Civil","Proc. Civil","Proc. Civil","Penal","Penal","Penal","Penal","Penal","Penal","Penal","Proc. Penal","Proc. Penal","Proc. Penal","Proc. Penal","Proc. Penal","Proc. Penal","Trabalho","Trabalho","Trabalho","Trabalho","Trabalho","Trabalho","Proc. Trabalho","Proc. Trabalho","Proc. Trabalho","Proc. Trabalho","Proc. Trabalho","Proc. Trabalho","Empresarial","Empresarial","Empresarial","Empresarial","Empresarial","Empresarial","Consumidor","Consumidor","Consumidor","Consumidor","Consumidor","Consumidor"];
const TEXTOS={
1:{q:"João, advogado, firmou contrato de associação com uma sociedade de advogados, sem vínculo de emprego, para prestar serviços advocatícios. Sobre esse contrato, assinale a correta:",a:"A) Deve indicar a forma de partilha dos honorários e a responsabilidade das partes, sem configurar vínculo empregatício.",b:"B) Gera automaticamente vínculo de emprego com a sociedade.",c:"C) É proibido pelo Estatuto da OAB.",d:"D) Só é válido se registrado na Justiça do Trabalho."},
2:{q:"Maria, advogada, atuou como defensora de um réu em processo criminal. Depois, é procurada pela polícia para colaborar em investigação contra esse ex-cliente, oferecendo informações sigilosas que obteve no exercício da advocacia. Sobre o sigilo profissional, assinale a correta:",a:"A) Maria pode revelar o segredo, pois o interesse público prevalece sempre.",b:"B) Maria pode revelar, se receber autorização do juiz.",c:"C) Maria pode revelar, se o cliente já foi condenado.",d:"D) Maria deve manter o sigilo, pois é dever profissional, salvo grave ameaça ao direito à vida e à honra, com autorização do cliente."},
3:{q:"Um advogado foi ofendido publicamente por um magistrado durante audiência, em razão do exercício profissional. O Conselho Seccional decide promover o desagravo público. Sobre o desagravo, assinale a correta:",a:"A) O desagravo depende de condenação criminal do ofensor.",b:"B) O desagravo só pode ser feito em sessão secreta.",c:"C) O desagravo só cabe se o advogado representar contra o ofensor.",d:"D) O desagravo é público, promovido pelo Conselho, para reafirmar as prerrogativas da advocacia."},
4:{q:"Um escritório de advocacia quer fazer publicidade nas redes sociais. Segundo o Código de Ética e Disciplina da OAB e o Provimento 205/2021, assinale a correta:",a:"A) Pode prometer resultados e usar linguagem mercantilista.",b:"B) Pode fazer publicidade comparativa com outros escritórios.",c:"C) Pode fazer publicidade informativa, sóbria, sem mercantilização, sem promessa de resultados e sem ostentação.",d:"D) Não pode fazer nenhuma publicidade em redes sociais."},
5:{q:"Pedro, advogado, atuou em causa própria e obteve êxito. Ele quer cobrar honorários de sucumbência da parte contrária. Sobre honorários, assinale a correta:",a:"A) O advogado que atua em causa própria tem direito a honorários de sucumbência, como se fosse terceiro.",b:"B) O advogado em causa própria nunca tem direito a honorários.",c:"C) Só tem direito se for empregado da parte.",d:"D) Só tem direito se houver contrato escrito com a outra parte."},
6:{q:"Carlos, advogado, é nomeado para cargo público incompatível com a advocacia, mas continua advogando normalmente. Sobre a inscrição na OAB, assinale a correta:",a:"A) Nada acontece, ele pode acumular.",b:"B) Sua inscrição fica apenas suspensa por 30 dias.",c:"C) Ele só precisa pagar anuidade em dobro.",d:"D) Sua inscrição deve ser cancelada, pois o exercício de cargo incompatível impede a advocacia."},
7:{q:"Uma sociedade de advogados quer contratar um estagiário de Direito. Sobre o estágio, assinale a correta:",a:"A) O estágio pode ser feito por qualquer pessoa, mesmo sem estar na faculdade.",b:"B) O estágio é permitido ao acadêmico de Direito, com inscrição na OAB como estagiário, e deve respeitar as atividades próprias e a supervisão.",c:"C) O estagiário pode assinar petições sozinho, como advogado.",d:"D) O estágio dispensa inscrição na OAB."},
8:{q:"Dois advogados querem constituir uma sociedade unipessoal de advocacia. Sobre essa sociedade, assinale a correta:",a:"A) É permitida, constituída por um só advogado, com registro na OAB, e o advogado não pode integrar outra sociedade.",b:"B) É proibida, toda sociedade precisa de 2 sócios.",c:"C) É permitida, mas o sócio pode integrar outras 5 sociedades.",d:"D) É permitida, mas dispensa registro na OAB."},
9:{q:"Sobre a teoria do direito e a norma jurídica, segundo a visão positivista de Hans Kelsen, assinale a correta:",a:"A) A validade da norma depende apenas de sua justiça moral.",b:"B) A norma só é válida se for aceita por todos.",c:"C) A norma é válida se for eficaz socialmente, mesmo sem autoridade.",d:"D) A validade da norma decorre de uma norma superior, até chegar à norma fundamental pressuposta."},
10:{q:"Sobre a teoria da justiça de John Rawls, o conceito de 'véu da ignorância' significa:",a:"A) Que o juiz deve ignorar a lei.",b:"B) Que as partes devem decidir sem saber seus interesses pessoais, para escolher princípios justos.",c:"C) Que a justiça é apenas vingança.",d:"D) Que a justiça deve favorecer sempre os ricos."},
11:{q:"A Constituição prevê que a casa é asilo inviolável do indivíduo. Sobre essa garantia, assinale a correta:",a:"A) A casa pode ser invadida a qualquer hora por ordem do síndico.",b:"B) A casa pode ser invadida a qualquer hora pela polícia, sem ordem.",c:"C) Ninguém pode penetrar na casa sem consentimento do morador, salvo em flagrante delito, desastre, para prestar socorro, ou por ordem judicial durante o dia.",d:"D) A casa pode ser invadida à noite com ordem judicial."},
12:{q:"Sobre o mandado de segurança, assinale a correta:",a:"A) Cabe contra qualquer ato, mesmo sem direito líquido e certo.",b:"B) Cabe para proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, quando o responsável for autoridade pública.",c:"C) Cabe para discutir crime.",d:"D) Cabe para cobrar dívida de dinheiro."},
13:{q:"Sobre a repartição de competências na Constituição, assinale a correta:",a:"A) Compete privativamente à União legislar sobre direito civil, comercial, penal e processual.",b:"B) Compete aos Municípios legislar sobre direito penal.",c:"C) Compete aos Estados legislar sobre nacionalidade.",d:"D) Compete à União legislar sobre horário de funcionamento do comércio local."},
14:{q:"Uma lei estadual contraria a Constituição Federal. Sobre o controle concentrado de constitucionalidade, assinale a correta:",a:"A) Qualquer cidadão pode propor ADI.",b:"B) Qualquer juiz de 1º grau pode declarar inconstitucionalidade com efeito erga omnes.",c:"C) A ADI pode ser proposta pelos legitimados do art. 103 da CF, como Presidente, Governador, PGR, OAB e partido político com representação no Congresso.",d:"D) A ADI só pode ser proposta pelo STF."},
15:{q:"Sobre os direitos e garantias fundamentais, assinale a correta:",a:"A) São garantias como o habeas corpus, mandado de segurança, habeas data e mandado de injunção, para proteger direitos contra abuso do Estado.",b:"B) Não podem ser invocados contra o Estado.",c:"C) Só valem para brasileiros natos.",d:"D) Podem ser suspensos a qualquer momento pelo Presidente."},
16:{q:"Sobre o controle difuso de constitucionalidade no Brasil, assinale a correta:",a:"A) Só o STF pode fazer.",b:"B) Qualquer juiz ou tribunal pode, no caso concreto, deixar de aplicar lei que entenda inconstitucional, com efeito entre as partes.",c:"C) É proibido no Brasil.",d:"D) Só vale para leis municipais."},
17:{q:"Sobre os objetivos fundamentais da República Federativa do Brasil, assinale a correta:",a:"A) Criar privilégios para uma região.",b:"B) Construir uma sociedade livre, justa e solidária, erradicar a pobreza, reduzir desigualdades e promover o bem de todos, sem preconceitos.",c:"C) Aumentar impostos.",d:"D) Fechar o Congresso."},
18:{q:"Sobre os tratados internacionais de direitos humanos, após a EC 45/2004, assinale a correta: (Questão anulada no gabarito definitivo - conta como acerto)",a:"A) Nunca têm status constitucional.",b:"B) São sempre leis ordinárias.",c:"C) Se aprovados em dois turnos, por 3/5 dos votos em cada Casa, equivalem a emendas constitucionais.",d:"D) Não valem no Brasil."},
19:{q:"Sobre a Corte Interamericana de Direitos Humanos, assinale a correta:",a:"A) Pode condenar o Estado brasileiro por violação de direitos previstos na Convenção Americana, com obrigação de reparar.",b:"B) Só julga crimes comuns.",c:"C) Não tem jurisdição sobre o Brasil.",d:"D) Só julga países europeus."},
20:{q:"Sobre nacionalidade brasileira, assinale a correta:",a:"A) Apenas quem nasce de pais brasileiros é brasileiro.",b:"B) Apenas estrangeiro naturalizado é brasileiro.",c:"C) São brasileiros natos os nascidos no Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país.",d:"D) Apenas quem mora 10 anos no Brasil é brasileiro."}
};
const qs=G.map((g,i)=>{
const n=i+1;
if(TEXTOS[n]) return {m:M[i],t:TEXTOS[n].q,opts:[TEXTOS[n].a,TEXTOS[n].b,TEXTOS[n].c,TEXTOS[n].d],c:g};
return {m:M[i],t:`Questão ${n} - ${M[i]} - Exame 39. Assinale a alternativa CORRETA conforme a legislação e o entendimento aplicado pela FGV no 39º Exame.`,opts:["A) Alternativa A - conforme o fundamento legal da matéria.","B) Alternativa B - conforme o fundamento legal da matéria.","C) Alternativa C - conforme o fundamento legal da matéria.","D) Alternativa D - conforme o fundamento legal da matéria."],c:g};
});
let idx=0, ans=Array(80).fill(null), time=5*3600;
function render(){
document.getElementById("counter").textContent=`Questão ${idx+1} de 80 - Respondidas: ${ans.filter(a=>a).length}`;
document.getElementById("materia").textContent=qs[idx].m;
document.getElementById("pergunta").textContent=qs[idx].t;
document.getElementById("bar").style.width=((idx+1)/80*100)+"%";
document.getElementById("opts").innerHTML=qs[idx].opts.map((o,j)=>{
const L="ABCD"[j]; return `<label><input type="radio" name="q" ${ans[idx]===L?"checked":""} onchange="ans[${idx}]='${L}'"> ${o}</label>`;
}).join("");
}
function next(){if(idx<79){idx++;render()}}
function prev(){if(idx>0){idx--;render()}}
function finish(){
let ac=0; ans.forEach((a,i)=>{if(a===G[i])ac++});
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("nota").textContent=ac+"/80";
document.getElementById("detalhe").textContent=`Você acertou ${ac} e errou ${80-ac}.`;
document.getElementById("aprovado").textContent=ac>=40?"✅ APROVADO! Você passou para a 2ª fase!":"❌ REPROVADO. Precisa de 40 para passar. Tente de novo!";
window.scrollTo(0,0);
}
setInterval(()=>{if(time<=0)return;time--;let h=String(Math.floor(time/3600)).padStart(2,"0"),m=String(Math.floor(time%3600/60)).padStart(2,"0"),s=String(time%60).padStart(2,"0");document.getElementById("timer").textContent=`${h}:${m}:${s}`},1000);
render();
</script>
