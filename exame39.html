<script>
const Q=[
{t:"Ana, advogada inscrita na OAB/SP, foi procurada por Pedro, que deseja propor ação contra seu ex-sócio. Pedro propõe pagar os honorários apenas se vencer a causa, mediante contrato de quota litis de 40% sobre o valor recebido.",q:"Sobre os honorários de quota litis, assinale a correta:",o:["É vedado em qualquer hipótese.","É permitido, desde que o percentual não seja abusivo e não haja aviltamento, observadas as regras do Estatuto.","Só é permitido em causas trabalhistas.","É permitido apenas se o cliente for hipossuficiente."],a:1},
{t:"Carlos, prefeito de um município, editou decreto proibindo a realização de cultos religiosos em praças públicas, sob argumento de perturbação do sossego. Um grupo religioso impetrou mandado de segurança.",q:"Diante do caso, assinale a correta:",o:["O decreto é válido, pois o sossego prevalece.","A liberdade de crença é absoluta.","O decreto viola a liberdade de religião, pois a limitação deve ser proporcional e prevista em lei, não por mero decreto.","Apenas cultos majoritários são protegidos."],a:2},
{t:"Mariana vendeu seu carro a João por R$ 40.000,00, afirmando que estava em perfeito estado. Uma semana depois, João descobriu defeito oculto no motor, que já existia na época da venda e tornava o carro impróprio.",q:"Nesse caso, João poderá:",o:["Apenas pedir desconto.","Rejeitar a coisa e pedir a redibição, ou abatimento do preço, por vício redibitório.","Nada fazer, pois comprou no estado em que se encontra.","Pedir apenas danos morais."],a:1},
{t:"Rafael, empregado há 3 anos, foi dispensado sem justa causa. Ele nunca gozou férias. A empresa alega que ele perdeu o direito porque não pediu no prazo.",q:"Sobre as férias, é correto afirmar:",o:["O empregado perde o direito se não requerer.","O direito a férias é do empregado e o período de concessão é do empregador, sendo devida indenização se não concedidas.","Férias só após 5 anos.","A empresa pode converter tudo em dinheiro."],a:1},
{t:"Lucas, de 19 anos, subtraiu o celular de uma colega, mediante grave ameaça com uma faca de brinquedo, que parecia verdadeira. A vítima entregou o bem por medo.",q:"A conduta configura:",o:["Furto, pois a faca era de brinquedo.","Roubo, pois a grave ameaça, ainda que com instrumento ineficaz, caracteriza o delito.","Estelionato.","Apenas constrangimento ilegal."],a:1},
{t:"Fernanda alugou um apartamento por 30 meses. Após 12 meses, o locador pediu o imóvel alegando que precisa para uso próprio, sem notificação.",q:"Assinale a correta:",o:["O locador pode retomar a qualquer tempo.","Durante o prazo, o locador só pode retomar nas hipóteses legais.","O locatário deve sair em 15 dias.","O contrato não tem prazo mínimo."],a:1},
{t:"Paulo foi abordado por policiais que, sem mandado e sem fundada suspeita, entraram em sua casa e apreenderam documentos em seu quarto.",q:"A prova obtida é:",o:["Válida, pois a polícia pode entrar sempre.","Ilícita, pois violou a inviolabilidade do domicílio, salvo flagrante ou consentimento.","Válida se o documento for importante.","Válida apenas à noite."],a:1},
{t:"Uma empresa publicou anúncio de emprego exigindo apenas candidatos do sexo masculino, com até 30 anos, para cargo de vendedor.",q:"O anúncio é:",o:["Válido.","Discriminatório e viola a igualdade e as normas trabalhistas.","Válido apenas para vendas.","Válido se pagar salário maior."],a:1},
{t:"Júlia, advogada, recebeu procuração, renunciou ao mandato sem comunicar o cliente e abandonou o processo, deixando o prazo correr.",q:"A conduta de Júlia:",o:["É lícita.","Viola o dever de zelo e pode gerar responsabilidade, pois deve comunicar e aguardar 10 dias.","É permitida se devolver os documentos depois de 1 ano.","Não gera consequência."],a:1},
{t:"Marcos firmou contrato de compra e venda de imóvel, pagou 90% do valor, mas o vendedor se recusou a outorgar a escritura alegando arrependimento.",q:"Marcos pode:",o:["Apenas pedir o dinheiro de volta.","Exigir o cumprimento forçado, por meio de adjudicação compulsória.","Nada fazer.","Invadir o imóvel."],a:1},
{t:"Em audiência trabalhista, o preposto da empresa faltou, sem justificativa. O juiz aplicou a revelia.",q:"A consequência da ausência do reclamado é:",o:["Apenas adiamento.","Revelia e confissão quanto à matéria de fato.","Extinção do processo.","Multa de 1% apenas."],a:1},
{t:"Beatriz, de 17 anos, comprou um celular parcelado sem autorização dos pais. Os pais querem anular o negócio.",q:"O negócio é:",o:["Válido, pois ela tem 17 anos.","Anulável, por incapacidade relativa, podendo ser anulado pelos responsáveis.","Nulo.","Válido se ela tiver dinheiro próprio."],a:1},
{t:"Um deputado estadual apresentou projeto de lei para criar um novo tributo municipal. O projeto foi aprovado e sancionado.",q:"O projeto é:",o:["Válido.","Inconstitucional, pois compete privativamente ao Município legislar sobre tributo municipal, com iniciativa do Executivo local.","Válido se o governador concordar.","Válido apenas para tributos federais."],a:1},
{t:"João foi preso em flagrante por furto. Na delegacia, ele pediu para falar com advogado, mas o delegado negou e o interrogou sem defensor.",q:"O interrogatório:",o:["É válido.","É nulo, pois viola o direito à assistência de advogado e ao silêncio.","É válido se ele confessar.","É válido se houver duas testemunhas."],a:1},
{t:"Uma loja vendeu produto com defeito e se recusou a trocar. O consumidor reclamou após 40 dias da compra, de produto não durável.",q:"Sobre a decadência:",o:["O prazo é de 90 dias para não duráveis.","O prazo para reclamar de vício em produto não durável é de 30 dias.","Não há prazo.","O prazo é de 5 anos sempre."],a:1},
{t:"Pedro, motorista de aplicativo, sofreu acidente enquanto trabalhava e ficou 20 dias afastado. A plataforma alega que ele não é empregado.",q:"Para caracterizar vínculo, é necessário:",o:["Apenas trabalhar com aplicativo.","Pessoalidade, onerosidade, não eventualidade e subordinação.","Ter carteira desde o primeiro dia.","Trabalhar 8h por dia."],a:1},
{t:"Cláudia, servidora pública, foi demitida após processo administrativo em que não pôde apresentar defesa.",q:"A demissão é:",o:["Válida.","Nula, por violação ao contraditório e à ampla defesa.","Válida se o chefe concordar.","Válida se houver sindicância."],a:1},
{t:"Antônio emprestou R$ 10.000,00 a José, com juros de 20% ao mês. José não pagou e Antônio cobra na Justiça.",q:"Os juros são:",o:["Válidos, pois foi combinado.","Abusivos e podem ser revisados, pois a onerosidade excessiva viola a função social.","Válidos se houver contrato escrito.","Válidos apenas para bancos."],a:1},
{t:"Uma empresa demitiu uma empregada grávida, sabendo da gravidez, sem justa causa.",q:"A empregada tem direito a:",o:["Apenas seguro-desemprego.","Estabilidade provisória desde a confirmação da gravidez até 5 meses após o parto, com reintegração ou indenização.","Nenhum direito.","Apenas aviso prévio."],a:1},
{t:"Ricardo foi condenado por roubo. Após cumprir a pena, praticou novo furto 2 anos depois.",q:"Ricardo é:",o:["Reincidente, pois praticou novo crime após condenação definitiva, dentro do prazo legal.","Primário.","Não pode ser punido de novo.","Apenas se o crime for igual."],a:0},
{t:"Larissa, advogada, publicou em redes sociais propaganda com valores de honorários e promessa de resultados garantidos.",q:"A publicidade:",o:["É permitida.","Viola o Código de Ética, que veda mercantilização, promessa de resultados e menção a valores.","É permitida se for famosa.","É permitida apenas no Instagram."],a:1},
{t:"Um município criou lei proibindo a entrada de caminhões de outra cidade, para proteger o comércio local.",q:"A lei é:",o:["Válida.","Inconstitucional, pois viola a livre circulação e a livre iniciativa.","Válida se houver pedágio.","Válida se o prefeito aprovar."],a:1},
{t:"Felipe comprou um imóvel na planta. A construtora atrasou a entrega em 2 anos, sem justificativa.",q:"Felipe pode:",o:["Apenas esperar.","Rescindir o contrato e pedir devolução dos valores, além de indenização, por inadimplemento.","Nada fazer.","Pagar multa."],a:1},
{t:"Em processo penal, o juiz condenou o réu com base apenas em depoimento de testemunha que não foi ouvida em juízo, sem outras provas.",q:"A condenação:",o:["É válida.","Viola o contraditório, pois prova só do inquérito não pode fundamentar condenação isoladamente.","É válida se o réu for confesso.","É válida se o juiz quiser."],a:1},
{t:"Uma empregada doméstica trabalhou 3 anos sem carteira, sem férias e 13º.",q:"A empregada doméstica:",o:["Não tem direitos.","Tem direitos garantidos pela Constituição, como férias, 13º e FGTS.","Só tem salário.","Só se trabalhar 8h."],a:1},
{t:"Gabriel, menor de 18 anos, foi apreendido por ato infracional análogo a roubo. A autoridade quer aplicar pena de prisão.",q:"Para adolescente, a medida correta é:",o:["Prisão igual a adulto.","Medida socioeducativa, prevista no ECA, e não pena.","Apenas advertência.","Internação obrigatória por 10 anos."],a:1},
{t:"Uma empresa de telefonia cobrou de um consumidor um serviço que ele nunca contratou.",q:"O consumidor:",o:["Deve pagar.","Pode pedir devolução em dobro do valor pago indevidamente, salvo engano justificável.","Só pode pedir valor simples.","Não pode reclamar."],a:1},
{t:"Hugo, advogado, foi contratado para defender um cliente, mas descobriu que já havia atuado para a parte contrária no mesmo processo.",q:"Hugo deve:",o:["Continuar.","Recusar / renunciar, por conflito de interesses e impedimento ético.","Atuar para os dois lados.","Cobrar o dobro."],a:1},
{t:"O presidente editou medida provisória sobre matéria já regulamentada por lei, sem urgência e relevância.",q:"A MP é:",o:["Válida.","Inconstitucional, por ausência dos pressupostos de urgência e relevância.","Válida se o Congresso aprovar em 1 dia.","Válida apenas em ano eleitoral."],a:1},
{t:"Sofia alugou um carro e bateu por culpa exclusiva de terceiro que avançou o sinal. A locadora cobra de Sofia.",q:"A responsabilidade é:",o:["De Sofia.","Do terceiro que causou o acidente, por culpa exclusiva.","Da locadora sempre.","De ninguém."],a:1},
{t:"Dona Maria, idosa de 78 anos, foi ao banco e o gerente fez ela assinar contrato de empréstimo consignado que ela não entendeu, descontando 40% da aposentadoria.",q:"O contrato:",o:["É válido, pois ela assinou.","Pode ser anulado/revisado, pois houve vício de consentimento e violação ao dever de informação ao consumidor hipervulnerável.","É válido se o banco devolver 10%.","É válido apenas para idosos."],a:1},
{t:"Carlos foi demitido por justa causa por ter faltado 3 dias seguidos sem justificativa. A empresa não fez advertência antes.",q:"A justa causa:",o:["É válida sempre.","Deve observar a proporcionalidade e gradação das penalidades; falta isolada, sem gravidade, pode ser desproporcional.","É válida se ele faltar 1 dia.","É válida se o patrão não gostar dele."],a:1},
{t:"Uma loja anunciou '50% de desconto em tudo' mas na hora do pagamento cobrou o preço cheio, alegando erro de sistema.",q:"O consumidor:",o:["Deve pagar o preço cheio.","Tem direito ao cumprimento da oferta, pois a publicidade vincula o fornecedor.","Não pode reclamar.","Só pode reclamar se tiver print."],a:1},
{t:"João e Maria viviam em união estável há 5 anos. João morreu e a família dele quer tirar Maria da casa, alegando que ela não era casada.",q:"Maria:",o:["Não tem direito nenhum.","Tem direitos sucessórios e de meação como companheira, equiparados ao cônjuge.","Só tem direito se tiver filhos.","Só tem direito se registrar em cartório."],a:1},
{t:"Um policial prendeu um homem em sua casa à noite, sem mandado, por suspeita de ter furtado uma bicicleta há 1 mês.",q:"A prisão é:",o:["Válida.","Ilegal, pois o domicílio é inviolável à noite, salvo flagrante, desastre ou para prestar socorro.","Válida se for antes das 22h.","Válida se o policial suspeitar."],a:1},
{t:"Empresa de ônibus demitiu motorista que se recusou a fazer horas extras além do limite legal, alegando insubordinação.",q:"A demissão:",o:["É válida.","É abusiva, pois o empregado pode recusar horas extras além do limite legal.","É válida se ele for o único motorista.","É válida se pagar adicional."],a:1},
{t:"Pedro comprou um terreno de um corretor que não era dono do imóvel. O verdadeiro dono apareceu e pediu o terreno de volta.",q:"Pedro:",o:["Fica com o terreno, pois pagou.","Pode perder o terreno, mas tem direito a indenização contra quem vendeu coisa alheia.","Não pode reclamar.","Pode invadir outro terreno."],a:1},
{t:"Uma advogada divulgou em grupo de WhatsApp dados do processo de seu cliente, que corria em segredo de justiça.",q:"A conduta:",o:["É permitida.","Viola o sigilo profissional e o segredo de justiça, podendo gerar sanção ética.","É permitida se o cliente for famoso.","É permitida se for em grupo fechado."],a:1},
{t:"O Estado desapropriou um terreno para construir escola, mas nunca pagou a indenização ao dono.",q:"O dono:",o:["Perdeu o terreno sem direito.","Tem direito à indenização prévia, justa e em dinheiro, e pode cobrar judicialmente.","Só pode reclamar após 10 anos.","Não pode reclamar de desapropriação."],a:1},
{t:"Lucas, empregado, sofreu acidente de trabalho por falta de EPI, que a empresa não forneceu. Ele ficou com sequela.",q:"A empresa:",o:["Não tem culpa.","Responde por indenização, pois tem dever de garantir segurança e fornecer EPI.","Só paga se ele pedir.","Só paga INSS."],a:1},
{t:"Uma mulher foi agredida pelo companheiro e pediu medida protetiva. O juiz negou alegando que ela não fez boletim de ocorrência.",q:"A decisão está:",o:["Correta.","Errada, pois a medida protetiva pode ser concedida com base na palavra da vítima e não depende de BO.","Correta se ela voltar com ele.","Correta se não houver testemunha."],a:1},
{t:"Um candidato foi reprovado em concurso público por ter tatuagem visível, embora o edital não proibisse.",q:"A reprovação é:",o:["Válida.","Ilegal, pois não pode haver restrição sem previsão legal e razoável.","Válida se a tatuagem for grande.","Válida se o cargo for policial."],a:1},
{t:"Joana emprestou seu nome para um amigo abrir empresa. A empresa faliu e os credores cobram de Joana.",q:"Joana:",o:["Não responde, pois só emprestou o nome.","Pode responder, pois ao figurar como sócia assumiu responsabilidades.","Só responde se for parente.","Nunca responde."],a:1},
{t:"Um banco negou abertura de conta para um cliente por ele morar em bairro periférico.",q:"A conduta do banco é:",o:["Válida, pois banco escolhe cliente.","Discriminatória e abusiva, violando a dignidade e o acesso a serviços essenciais.","Válida se ele não tiver renda.","Válida se for banco privado."],a:1},
{t:"Marcos foi multado por dirigir sem CNH, mas ele tinha CNH, apenas esqueceu em casa.",q:"A infração:",o:["É a mesma de dirigir sem habilitação.","É infração leve por não portar documento, diferente de não ser habilitado.","Não existe multa.","É crime."],a:1},
{t:"Uma escola particular expulsou aluno por ele ter reprovado 2 vezes, sem dar direito de defesa.",q:"A expulsão é:",o:["Válida.","Nula, pois viola o contraditório e o direito à educação.","Válida se ele for indisciplinado.","Válida se os pais concordarem."],a:1},
{t:"Paulo, advogado, cobrou honorários 10 vezes acima da tabela da OAB, sem justificar, de cliente idoso e doente.",q:"A cobrança:",o:["É permitida.","É abusiva e viola a moderação dos honorários e o Código de Ética.","É permitida se o cliente assinar.","É permitida se for causa ganha."],a:1},
{t:"Uma empresa de plano de saúde negou cobertura de cirurgia de urgência alegando carência, embora o contrato previsse urgência.",q:"A negativa é:",o:["Válida.","Abusiva, pois em urgência/emergência não pode negar cobertura essencial.","Válida se o cliente tiver 1 mês de plano.","Válida se for cirurgia cara."],a:1},
{t:"Fernando, servidor, foi acusado de corrupção. No processo, a única prova foi uma conversa gravada por um colega sem autorização judicial.",q:"A gravação:",o:["É válida sempre.","Pode ser ilícita se feita por terceiro sem autorização, devendo ser analisada a licitude da prova.","É válida se ele for culpado.","É válida se for no trabalho."],a:1},
{t:"Uma vizinha construiu um muro invadindo 1 metro do terreno do vizinho. O vizinho descobriu 2 anos depois.",q:"O vizinho pode:",o:["Nada fazer.","Pedir a demolição / reintegração, pois invasão não gera direito automático.","Esperar 10 anos.","Invadir o terreno dela também."],a:1},
{t:"Em uma eleição, um candidato distribuiu cestas básicas em troca de votos.",q:"A conduta configura:",o:["Propaganda normal.","Captação ilícita de sufrágio / compra de votos, podendo gerar cassação.","É permitida se for cesta pequena.","É permitida se for antes da eleição."],a:1},
{t:"Uma empregada foi chamada de apelido ofensivo pelo chefe todos os dias, na frente de todos, e pediu demissão.",q:"Ela pode:",o:["Apenas pedir demissão.","Pedir rescisão indireta por assédio moral e indenização.","Nada fazer.","Apenas trocar de setor."],a:1},
{t:"Carlos vendeu um produto pela internet. O cliente se arrependeu em 5 dias e pediu devolução.",q:"O cliente:",o:["Não pode devolver.","Tem direito de arrependimento em 7 dias nas compras fora do estabelecimento, com devolução integral.","Só pode trocar.","Só pode devolver se tiver defeito."],a:1},
{t:"Um réu foi absolvido por falta de provas. O Ministério Público quer recorrer alegando que o juiz errou.",q:"O recurso:",o:["É proibido.","É permitido, pois a acusação pode recorrer da absolvição, respeitado o devido processo.","É proibido se for réu primário.","É proibido se não houver testemunha."],a:1},
{t:"Maria, gestante, foi contratada por contrato temporário de 3 meses. No fim, a empresa não renovou por causa da gravidez.",q:"Maria tem:",o:["Nenhum direito.","Estabilidade provisória da gestante, mesmo em contrato temporário, conforme entendimento do STF.","Apenas salário.","Apenas se for concursada."],a:1},
{t:"Um advogado foi contratado para fazer um acordo, mas fez o acordo sem autorização do cliente, prejudicando-o.",q:"O acordo é:",o:["Válido.","Pode ser anulado, pois o advogado precisa de poderes especiais para transigir.","Válido se for bom para o cliente.","Válido se o juiz homologar."],a:1},
{t:"Uma prefeitura cobrou IPTU de um templo religioso, usado apenas para cultos.",q:"A cobrança é:",o:["Válida.","Inconstitucional, pois há imunidade tributária para templos de qualquer culto.","Válida se o templo for pequeno.","Válida se for igreja católica."],a:1},
{t:"João foi preso por não pagar pensão alimentícia. Ele alega que está desempregado e não pode pagar.",q:"A prisão civil por alimentos:",o:["É proibida.","É permitida, pois é a única prisão civil admitida, salvo se comprovada impossibilidade absoluta.","É proibida se ele for pai.","É permitida apenas se ele for rico."],a:1},
{t:"Uma empresa demitiu 100 funcionários sem negociar com o sindicato, em plena pandemia, alegando crise.",q:"A demissão em massa:",o:["É livre.","Deve observar a negociação coletiva e o diálogo social, sob pena de nulidade, conforme entendimento atual.","É livre se a empresa estiver em crise.","É livre se pagar verbas."],a:1},
{t:"Um casal se divorciou. O pai não paga pensão e não visita o filho há 1 ano, sem justificativa.",q:"O pai pode:",o:["Ser preso sempre.","Responder por abandono afetivo e ter a guarda revisada, além de execução da pensão.","Nada acontecer.","Perder a guarda automaticamente."],a:1},
{t:"Uma farmácia vendeu remédio vencido para um idoso, que passou mal.",q:"A farmácia:",o:["Não tem culpa.","Responde objetivamente pelo defeito do produto e deve indenizar.","Só responde se o idoso provar culpa.","Só responde se houver receita."],a:1},
{t:"Um candidato a advogado foi reprovado no Exame da OAB e alega que a prova foi anulada sem motivo.",q:"Ele pode:",o:["Nada fazer.","Interpor recurso administrativo e, se necessário, ação judicial para anulação de questão viciada.","Pedir para passar direto.","Pedir para fazer outra prova grátis."],a:1},
{t:"Um condômino fez obra que prejudicou a estrutura do prédio, rachando a parede do vizinho.",q:"O condômino:",o:["Não responde.","Responde pelos danos causados e deve reparar, além de poder ser multado pelo condomínio.","Só responde se for engenheiro.","Só responde se o síndico autorizar."],a:1},
{t:"Uma empresa de aplicativo bloqueou o motorista sem explicar o motivo e sem dar defesa.",q:"O bloqueio:",o:["É livre.","Deve observar o contraditório e a transparência, pois há relação contratual.","É livre se o motorista for novo.","É livre se for por avaliação baixa."],a:1},
{t:"Um juiz julgou um processo em que era amigo íntimo de uma das partes, sem se declarar impedido.",q:"A sentença é:",o:["Válida.","Nula, pois há causa de impedimento/suspeição que compromete a imparcialidade.","Válida se ele for justo.","Válida se ninguém reclamar."],a:1},
{t:"Uma mulher descobriu que seu marido abriu conta em seu nome e fez empréstimos sem ela saber.",q:"Os empréstimos:",o:["São válidos.","Podem ser anulados, pois houve falsidade e ausência de consentimento.","São válidos se ele for marido.","São válidos se ele pagar."],a:1},
{t:"Um empregado trabalhou 12h por dia, sem intervalo, durante 6 meses, e desenvolveu doença ocupacional.",q:"O empregado tem direito a:",o:["Apenas salário.","Indenização por danos e horas extras, pois houve violação às normas de saúde e jornada.","Apenas adicional noturno.","Nada, pois ele aceitou."],a:1},
{t:"Um município proibiu a venda de bebidas alcoólicas após 22h, sem lei, apenas por decreto do prefeito.",q:"O decreto é:",o:["Válido.","Ilegal, pois restrição à liberdade econômica e individual exige lei formal.","Válido se for para segurança.","Válido se a câmara concordar depois."],a:1},
{t:"Uma cliente contratou advogada para divórcio, mas a advogada passou a defender o ex-marido em outro processo sobre os mesmos bens.",q:"A advogada:",o:["Pode atuar.","Está impedida por conflito de interesses e quebra de fidelidade.","Pode atuar se cobrar menos.","Pode atuar se o ex pagar mais."],a:1},
{t:"Um jovem de 20 anos foi abordado e confessou crime após ser ameaçado de agressão por policiais.",q:"A confissão é:",o:["Válida.","Nula, pois obtida mediante coação, violando o direito ao silêncio e à não autoincriminação.","Válida se ele for culpado.","Válida se houver testemunha."],a:1},
{t:"Uma loja se recusou a vender para um cliente negro, alegando que não tinha o produto, mas vendeu para outro cliente branco logo depois.",q:"A conduta configura:",o:["Liberdade de vender.","Discriminação racial, crime e dano moral, violando a igualdade.","É permitida se a loja for particular.","É permitida se o gerente não gostar."],a:1},
{t:"Um trabalhador rural trabalhou sem registro, 6 dias por semana, sem folga, por 2 anos.",q:"Ele tem direito a:",o:["Nenhum.","Todos os direitos trabalhistas, como urbano, incluindo repouso semanal e horas extras.","Apenas salário.","Apenas se for registrado."],a:1},
{t:"Uma empresa faliu e não pagou os salários dos últimos 3 meses. Os empregados querem receber antes dos bancos.",q:"Os créditos trabalhistas:",o:["Ficam por último.","Têm preferência sobre créditos tributários e bancários, até certo limite legal.","Não têm preferência.","Só recebem se sobrar."],a:1},
{t:"Um pai registrou o filho, mas depois descobriu que não era pai biológico e quer anular o registro.",q:"Ele:",o:["Pode anular sempre.","A paternidade socioafetiva pode prevalecer sobre a biológica, se houver vínculo afetivo consolidado.","Nunca pode anular.","Pode anular se pagar pensão."],a:1},
{t:"Uma universidade cobrou taxa para emitir diploma, mesmo o aluno tendo pago todas as mensalidades.",q:"A cobrança é:",o:["Válida.","Abusiva, pois a emissão de diploma integra o serviço educacional contratado.","Válida se for taxa pequena.","Válida se for universidade particular."],a:1},
{t:"Um advogado publicou petição com ofensas pessoais ao juiz, chamando-o de corrupto, sem provas.",q:"A conduta:",o:["É liberdade de expressão.","Viola a ética, pois o advogado deve agir com urbanidade, sem ofensas, podendo ser sancionado.","É permitida se ele estiver bravo.","É permitida se for verdade."],a:1},
{t:"Uma pessoa foi condenada por furto e cumpriu pena. Anos depois, prestou concurso e foi eliminada por antecedentes criminais, mesmo reabilitada.",q:"A eliminação:",o:["É válida.","Pode ser ilegal, pois a reabilitação apaga os efeitos penais e não pode gerar discriminação eterna.","É válida se o cargo for público.","É válida se o crime for grave."],a:1},
{t:"Um locatário pintou o apartamento de outra cor sem autorização e quebrou uma parede.",q:"O locatário:",o:["Não responde.","Deve reparar o dano e pode responder por benfeitoria não autorizada.","Pode fazer o que quiser.","Só responde se o dono ver."],a:1},
{t:"Um empresário sonegou impostos por 5 anos, omitindo receitas. A Receita descobriu e cobrou multa.",q:"A conduta:",o:["É apenas erro.","Configura crime tributário e infração administrativa, podendo gerar multa e processo penal.","É permitida se ele pagar depois.","É apenas dívida."],a:1},
{t:"Uma gestante foi demitida e a empresa alega que não sabia da gravidez.",q:"A estabilidade:",o:["Depende do conhecimento do empregador.","Independe do conhecimento do empregador, bastando a gravidez na data da dispensa.","Não existe.","Depende de aviso prévio."],a:1}
];
let idx=0, acertos=0, sel=-1;
function mostra(){ const q=Q[idx]; document.getElementById('num').innerText=`Questão ${idx+1} de 80`; document.getElementById('caso').innerText=q.t+"\n\n"+q.q; document.getElementById('prog').style.width=((idx)/80*100)+'%'; document.getElementById('placar').innerText=`Acertos: ${acertos}`; document.getElementById('res').innerText=''; sel=-1; document.getElementById('opts').innerHTML=q.o.map((o,i)=>`<div class="opt" onclick="escolher(${i},this)">${String.fromCharCode(65+i)}) ${o}</div>`).join('');}
function escolher(i,el){ sel=i; document.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel')); el.classList.add('sel');}
function proxima(){ if(sel==-1){alert('Escolha uma alternativa!');return;} if(sel==Q[idx].a){acertos++; document.getElementById('res').innerText='✅ Correta!';} else {document.getElementById('res').innerText='❌ Errada! Correta: '+String.fromCharCode(65+Q[idx].a);} setTimeout(()=>{ idx++; if(idx>=Q.length){alert(`Fim! Você acertou ${acertos} de 80`); idx=0; acertos=0;} mostra(); },900); }
mostra();
</script>
