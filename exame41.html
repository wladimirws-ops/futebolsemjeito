<script>
const gabarito41 = ["B","A","B","D","A","B","C","C","B","B","B","C","B","B","B","A","A","B","C","B","A","B","A","C","D","C","D","C","B","C","D","A","D","C","C","D","D","B","D","A","D","D","A","B","A","A","C","D","A","B","D","D","B","B","C","A","D","C","D","A","D","C","A","A","C","A","C","C","D","A","A","C","D","C","B","C","D","B","A","A"];
let questoes41 = [
{pergunta:"1. Ética - Daniel foi suspenso por 6 meses por assédio. Cumpriu há mais de 1 ano, mas a pena criminal ainda está em execução. Ele pode pedir reabilitação?", a:"Sim, pois já passou 1 ano, é direito subjetivo", b:"Não, pois mesmo com bom comportamento, depende também da reabilitação criminal", c:"Sim, com bom comportamento, pois há independência entre instâncias", d:"Sim, mas deve pedir direto no Conselho Federal", correta:"B"},
{pergunta:"2. Ética - Saulo foi preso e pediu para advogada Janete ver os motivos da prisão e a investigação. Como fica o acesso?", a:"Pode examinar autos de flagrante e investigação mesmo sem procuração, mas se houver sigilo precisa de procuração", b:"Só pode com procuração em qualquer caso", c:"Não pode examinar investigação em andamento", d:"É vedado fornecer autos incompletos", correta:"A"},
{pergunta:"3. Ética - João Pedro, por vingança, contrata Beraldo para ação de cobrança temerária contra ex-sócio. O que Beraldo deve fazer?", a:"Propor a ação, pois deve obedecer o cliente", b:"Deve recusar patrocinar lide temerária, pois é dever ético", c:"Pode propor, desde que avise o juiz", d:"Pode propor e depois desistir", correta:"B"},
{pergunta:"4. Ética - Ana Júlia, recém-aprovada, quer agir com ética. Qual conduta é dever ético?", a:"Cobrar honorários abaixo do mínimo", b:"Guardar sigilo profissional e agir com boa-fé", c:"Divulgar segredo do cliente", d:"Aceitar causa contra ex-cliente sem cautela", correta:"B"},
{pergunta:"5. Ética - Gilson, recém-inscrito, dúvida entre sociedade unipessoal e simples. Qual regra vale?", a:"Não pode constituir sociedade unipessoal", b:"Pode constituir sociedade unipessoal de advocacia", c:"Só pode se tiver 5 anos de inscrição", d:"Só pode sociedade com outro advogado", correta:"B"},
{pergunta:"6. Ética - Marina prestou consultoria tributária para empresa. Como pode ser a consultoria?", a:"Só por escrito e com contrato", b:"Pode ser por escrito ou verbal, se as partes acordarem, mesmo sem mandato ou contrato formal", c:"Se verbal, precisa de contrato escrito", d:"Só se houver mandato", correta:"B"},
{pergunta:"7. Ética - Atena (médica) e Dionísio (advogado) casados, moram em casa alugada. Sobre domicílio profissional?", a:"Não pode advogar onde mora", b:"Domicílio profissional é onde mantém escritório, mesmo com residência em outro local", c:"Casamento com médica impede advocacia", d:"Só pode advogar onde nasceu", correta:"B"},
{pergunta:"8. Ética - Pedro Estrela, preso em flagrante por pirâmide financeira, se apresenta como advogado. Regra sobre prisão?", a:"Advogado só pode ser preso em flagrante por crime inafiançável, com presença de representante da OAB", b:"Pode ser preso por qualquer crime sem formalidade", c:"Não pode ser preso nunca", d:"Só com ordem do Conselho Federal", correta:"A"},
{pergunta:"9. Filosofia - 'Quinhoar desigualmente aos desiguais, na medida em que se desigualam.' O que significa?", a:"Todos devem receber exatamente o mesmo", b:"Tratar igualmente os iguais e desigualmente os desiguais, na medida da desigualdade", c:"A igualdade proíbe qualquer diferença", d:"Só vale para direito penal", correta:"B"},
{pergunta:"10. Filosofia - Sobre Hans Kelsen e Teoria Pura do Direito:", a:"Defende estudar Direito com moral e política juntas", b:"Busca estudar o Direito sem elementos estranhos, como moral, com foco na norma", c:"Negava hierarquia de normas", d:"Norma fundamental é escrita na Constituição", correta:"B"},
{pergunta:"11. Civil - Sobre prescrição e decadência, assinale a correta:", a:"Prescrição pode ser alegada de ofício pelo juiz em qualquer caso", b:"A prescrição pode ser renunciada após consumada, expressa ou tacitamente", c:"Decadência nunca se interrompe", d:"Prescrição atinge o direito em si", correta:"B"},
{pergunta:"12. Civil - Sobre negócio jurídico, quando há defeito por erro, assinale:", a:"Erro de cálculo sempre anula o negócio", b:"Erro sobre pessoa só anula se for essencial", c:"O erro substancial que poderia ser percebido por pessoa de diligência normal torna o negócio anulável", d:"Erro de direito nunca é relevante", correta:"C"},
{pergunta:"13. Civil - Sobre responsabilidade civil, assinale a correta:", a:"Só há responsabilidade com culpa", b:"Em regra, a responsabilidade é subjetiva, mas há casos de responsabilidade objetiva previstos em lei", c:"Dano moral nunca é indenizável", d:"Excludente de ilicitude nunca afasta dever de indenizar", correta:"B"},
{pergunta:"14. Civil - Sobre contratos, assinale a correta:", a:"Contrato só vale se for escrito", b:"A função social do contrato limita a liberdade de contratar", c:"Contrato de adesão não pode ser interpretado a favor do aderente", d:"Cláusula abusiva nunca pode ser anulada", correta:"B"},
{pergunta:"15. Civil - Sobre posse, assinale a correta:", a:"Posse é só de quem é dono", b:"Possuidor de boa-fé tem direito aos frutos percebidos e a indenização por benfeitorias", c:"Posse nunca se transmite", d:"Esbulho não gera proteção possessória", correta:"B"},
{pergunta:"16. Constitucional - Sobre direitos fundamentais, assinale:", a:"Os direitos fundamentais têm aplicação imediata e podem ser invocados contra o Estado e particulares", b:"Direitos fundamentais só valem contra o Estado", c:"Nenhum direito fundamental pode ser limitado", d:"Direitos sociais não são fundamentais", correta:"A"},
{pergunta:"17. Constitucional - Sobre controle de constitucionalidade, assinale:", a:"No controle difuso, qualquer juiz pode afastar lei inconstitucional no caso concreto", b:"Só o STF pode fazer controle difuso", c:"Controle concentrado é feito por qualquer juiz", d:"ADI só pode ser proposta pelo Presidente", correta:"A"},
{pergunta:"18. Constitucional - Sobre repartição de competências, assinale:", a:"Município pode legislar sobre direito penal", b:"Compete à União, Estados e DF legislar concorrentemente sobre direito civil, com normas gerais da União", c:"Estado não pode legislar sobre nada", d:"União tem competência exclusiva para tudo", correta:"B"},
{pergunta:"19. Constitucional - Sobre Poder Judiciário, assinale:", a:"Juiz pode ser afastado sem processo", b:"Magistratura é vitalícia desde a posse", c:"São garantias da magistratura: vitaliciedade, inamovibilidade e irredutibilidade de subsídio", d:"Tribunal não pode julgar seus membros", correta:"C"},
{pergunta:"20. Administrativo - Sobre ato administrativo, assinale:", a:"Ato administrativo nunca pode ser anulado", b:"A Administração pode anular seus atos ilegais e revogar os inconvenientes, respeitados direitos adquiridos", c:"Ato vinculado não pode ser controlado", d:"Motivo do ato nunca importa", correta:"B"},
{pergunta:"21. Administrativo - Sobre licitação, assinale a correta:", a:"A licitação busca selecionar a proposta mais vantajosa e garantir isonomia entre concorrentes", b:"Licitação só serve para comprar bens", c:"Pode haver licitação sem publicidade", d:"Vence sempre o menor preço, sem exceção", correta:"A"},
{pergunta:"22. Administrativo - Sobre servidores públicos, assinale:", a:"Servidor estável nunca pode ser demitido", b:"A estabilidade é adquirida após 3 anos de efetivo exercício e aprovação em avaliação", c:"Cargo em comissão tem estabilidade", d:"Servidor temporário tem estabilidade", correta:"B"},
{pergunta:"23. Administrativo - Sobre responsabilidade do Estado, assinale:", a:"O Estado responde objetivamente pelos danos causados por seus agentes, assegurado direito de regresso em caso de dolo ou culpa", b:"Estado só responde se houver culpa", c:"Estado nunca responde por omissão", d:"Agente nunca responde pessoalmente", correta:"A"},
{pergunta:"24. Tributário - Sobre princípios tributários, assinale:", a:"Pode cobrar tributo retroativo", b:"Tributo pode ser confiscatório", c:"É vedado cobrar tributo sem lei que o estabeleça, salvo exceções constitucionais", d:"Imposto pode ser cobrado sem anterioridade", correta:"C"},
{pergunta:"25. Tributário - Sobre imunidade tributária, assinale:", a:"Imunidade é isenção concedida por lei", b:"Imunidade pode ser revogada por lei ordinária", c:"Imunidade é igual a não incidência", d:"A imunidade é limitação constitucional ao poder de tributar", correta:"D"},
{pergunta:"26. Tributário - Sobre crédito tributário, assinale:", a:"Crédito tributário nasce com a lei", b:"Lançamento é facultativo", c:"O lançamento constitui o crédito tributário, tornando-o exigível", d:"Crédito tributário nunca prescreve", correta:"C"},
{pergunta:"27. Penal - Sobre aplicação da lei penal, assinale:", a:"Lei penal pode retroagir para prejudicar", b:"Costume pode criar crime", c:"Analogia pode criar crime", d:"Não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal", correta:"D"},
{pergunta:"28. Penal - Sobre culpabilidade, assinale:", a:"Culpabilidade é igual a dolo", b:"Menor de 18 anos é imputável", c:"São excludentes de culpabilidade: inimputabilidade, erro de proibição inevitável e inexigibilidade de conduta diversa", d:"Embriaguez voluntária sempre exclui culpa", correta:"C"},
{pergunta:"29. Penal - Sobre crimes contra a pessoa, assinale:", a:"Homicídio culposo tem pena maior que doloso", b:"O homicídio qualificado por motivo fútil tem pena maior que o simples", c:"Lesão corporal leve é crime inafiançável", d:"Não há tentativa em crime culposo doloso", correta:"B"},
{pergunta:"30. Penal - Sobre prescrição penal, assinale:", a:"Prescrição nunca corre", b:"Prescrição só beneficia réu rico", c:"A prescrição extingue a punibilidade e pode ocorrer antes ou depois do trânsito em julgado", d:"Crime hediondo nunca prescreve", correta:"C"},
];
for(let i=30;i<80;i++){ questoes41.push({pergunta:`Questão ${i+1} - [AGUARDANDO LOTE - 31 a 80]`, a:"Alternativa A", b:"Alternativa B", c:"Alternativa C", d:"Alternativa D", correta:gabarito41[i]}); }
let atual=0, acertos=0, tempo=5*60*60, intervalo, jaRespondeu=false;
function iniciar41(){ document.getElementById('tela-inicio').style.display='none'; document.getElementById('tela-questao').style.display='block'; atual=0; acertos=0; tempo=5*60*60; clearInterval(intervalo); intervalo=setInterval(()=>{ tempo--; let h=Math.floor(tempo/3600), m=Math.floor((tempo%3600)/60), s=tempo%60; document.getElementById('timer').innerText=`⏰ ${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(tempo<=0){ clearInterval(intervalo); finalizar41(); } },1000); mostrar(); }
function mostrar(){ jaRespondeu=false; let q=questoes41[atual]; document.getElementById('feedback').style.display='none'; document.getElementById('btnProxima').innerText="PRÓXIMA ➡️"; document.getElementById('progresso').innerText=`Questão ${atual+1} de 80 | Acertos: ${acertos}`; document.getElementById('questao').innerHTML=`<p><b>${q.pergunta}</b></p><label><input type="radio" name="resp" value="A"> A) ${q.a}</label><label><input type="radio" name="resp" value="B"> B) ${q.b}</label><label><input type="radio" name="resp" value="C"> C) ${q.c}</label><label><input type="radio" name="resp" value="D"> D) ${q.d}</label>`; }
function proxima41(){ if(!jaRespondeu){ let sel=document.querySelector('input[name="resp"]:checked'); if(!sel){ alert("Marca uma alternativa!"); return; } let q=questoes41[atual]; let fb=document.getElementById('feedback'); fb.style.display='block'; if(sel.value===q.correta){ acertos++; fb.style.background="#d4edda"; fb.innerText="✅ ACERTOU! Boa! Continua!"; } else{ fb.style.background="#f8d7da"; fb.innerText=`❌ ERROU! Você marcou ${sel.value}, a certa é ${q.correta}.`; } document.getElementById('progresso').innerText=`Questão ${atual+1} de 80 | Acertos: ${acertos}`; document.getElementById('btnProxima').innerText="CONTINUAR ➡️"; jaRespondeu=true; return; } else { atual++; if(atual<80) mostrar(); else finalizar41(); } }
function pular41(){ atual++; if(atual<80) mostrar(); else finalizar41(); }
function irPara(){ let n=parseInt(document.getElementById('pularPara').value); if(!n||n<1||n>80){ alert("Digita de 1 a 80"); return; } atual=n-1; mostrar(); }
function finalizar41(){ clearInterval(intervalo); document.getElementById('tela-questao').style.display='none'; document.getElementById('tela-fim').style.display='block'; let passou=acertos>=40?"APROVADO ✅":"REPROVADO ❌"; document.getElementById('resultado').innerText=`${passou} - ${acertos}/80`; document.getElementById('detalhe').innerText=`Você precisava de 40 acertos.`; }
</script>
