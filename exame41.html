<!-- EXAME 41 COMPLETO -->
<div id="exame41" style="display:none; max-width:800px; margin:auto; padding:15px;">
  <h2>41º Exame OAB - 1ª Fase</h2>
  <div id="timer41" style="font-size:28px; font-weight:bold; text-align:center; color:#ff0000;">⏰ 5:00:00</div>
  <p style="text-align:center;">Ritmo ideal: 3min 45s por questão | 80 questões | 5 horas</p>
  <p id="progresso41" style="text-align:center; font-weight:bold;">Questão 1 de 80</p>
  <div id="questao41"></div>
  <button onclick="proxima41()" style="width:100%; padding:12px; margin-top:15px; font-size:18px;">PRÓXIMA ➡️</button>
  <button onclick="finalizar41()" style="width:100%; padding:12px; margin-top:10px;">FINALIZAR PROVA</button>
</div>

<script>
const gabarito41 = ["B","A","B","D","A","B","C","C","B","B","B","C","B","B","B","A","A","B","C","B","A","B","A","C","D","C","D","C","B","C","D","A","D","C","C","D","D","B","D","A","D","D","A","B","A","A","C","D","A","B","D","D","B","B","C","A","D","C","D","A","D","C","A","A","C","A","C","C","D","A","A","C","D","C","B","C","D","B","A","A"];

// Aqui tu cola os enunciados do PDF oficial, um por linha, no mesmo formato dos exames 36-40
let questoes41 = [];
for(let i=0; i<80; i++){
  questoes41.push({
    pergunta: `Questão ${i+1} - [COLAR ENUNCIADO DO PDF OFICIAL AQUI]`,
    a: "Alternativa A", b: "Alternativa B", c: "Alternativa C", d: "Alternativa D",
    correta: gabarito41[i]
  });
}

let atual41 = 0, acertos41 = 0, tempo41 = 5*60*60, timer41Interval;

function iniciar41(){
  document.getElementById('exame41').style.display='block';
  atual41=0; acertos41=0; tempo41=5*60*60;
  clearInterval(timer41Interval);
  timer41Interval=setInterval(()=>{
    tempo41--;
    let h=Math.floor(tempo41/3600), m=Math.floor((tempo41%3600)/60), s=tempo41%60;
    document.getElementById('timer41').innerText=`⏰ ${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if(tempo41===1800) alert("⚠️ Faltam 30 min! Acelera!");
    if(tempo41<=0){ clearInterval(timer41Interval); alert("⏰ Tempo esgotado!"); finalizar41(); }
  },1000);
  mostrar41();
}

function mostrar41(){
  let q=questoes41[atual41];
  document.getElementById('progresso41').innerText=`Questão ${atual41+1} de 80`;
  document.getElementById('questao41').innerHTML=`
    <p><b>${q.pergunta}</b></p>
    <label><input type="radio" name="resp41" value="A"> A) ${q.a}</label><br>
    <label><input type="radio" name="resp41" value="B"> B) ${q.b}</label><br>
    <label><input type="radio" name="resp41" value="C"> C) ${q.c}</label><br>
    <label><input type="radio" name="resp41" value="D"> D) ${q.d}</label><br>`;
}

function proxima41(){
  let sel=document.querySelector('input[name="resp41"]:checked');
  if(sel && sel.value===questoes41[atual41].correta) acertos41++;
  atual41++;
  if(atual41<80) mostrar41(); else finalizar41();
}

function finalizar41(){
  clearInterval(timer41Interval);
  let nota = acertos41 >= 40 ? "APROVADO ✅" : "REPROVADO ❌ - Precisa de 40";
  alert(`FIM DO 41º EXAME\nAcertos: ${acertos41}/80\n${nota}`);
}
</script>
