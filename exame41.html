let questoes41 = [
{pergunta:"1. Ética - Daniel é advogado em Recife e foi condenado pelo Tribunal de Ética.<br>Ele recebeu pena de suspensão por 6 meses por ter assediado uma colega de trabalho.<br>Daniel cumpriu a suspensão há mais de 1 ano e teve bom comportamento desde então.<br>Ele quer pedir reabilitação para limpar sua ficha na OAB e voltar a advogar sem restrições.<br>Porém, a pena criminal pelo mesmo fato ainda está em execução na Justiça Criminal.<br>Ele procura a OAB para saber se já pode pedir a reabilitação.<br>Sobre a reabilitação, assinale a correta:", a:"Sim, pois já passou 1 ano, é direito subjetivo", b:"Não, pois mesmo com bom comportamento, depende também da reabilitação criminal", c:"Sim, com bom comportamento, pois há independência entre instâncias", d:"Sim, mas deve pedir direto no Conselho Federal", correta:"B"},
{pergunta:"2. Ética - Saulo foi preso em flagrante em Paulista por tráfico de drogas.<br>Sua família procurou a advogada Janete para defendê-lo no caso.<br>Janete foi até a delegacia para ver os motivos da prisão e a investigação.<br>Ela ainda não tinha procuração assinada por Saulo ou pela família.<br>O delegado disse que ela não poderia ver o inquérito sem procuração.<br>Janete alega que tem direito de examinar os autos mesmo sem procuração.<br>Sobre o acesso do advogado ao inquérito, assinale:", a:"Pode examinar autos de flagrante e investigação mesmo sem procuração, mas se houver sigilo precisa de procuração", b:"Só pode com procuração em qualquer caso", c:"Não pode examinar investigação em andamento", d:"É vedado fornecer autos incompletos", correta:"A"},
{pergunta:"3. Ética - João Pedro está brigado com seu ex-sócio há mais de 2 anos.<br>Por vingança, ele procura o advogado Beraldo para entrar com uma ação.<br>João Pedro quer uma ação de cobrança temerária contra o ex-sócio, sem provas.<br>Ele oferece pagar o dobro de honorários se Beraldo aceitar a causa.<br>Beraldo percebe que a ação não tem fundamento e é só para prejudicar.<br>Ele fica em dúvida se deve aceitar ou recusar o caso.<br>Sobre o dever do advogado diante de lide temerária, assinale:", a:"Propor a ação, pois deve obedecer o cliente", b:"Deve recusar patrocinar lide temerária, pois é dever ético", c:"Pode propor, desde que avise o juiz", d:"Pode propor e depois desistir", correta:"B"},
{pergunta:"4. Ética - Ana Júlia passou na OAB há 1 mês e abriu seu escritório.<br>Ela quer agir com ética e construir uma boa reputação na cidade.<br>Um cliente oferece dinheiro para ela divulgar segredo de outro cliente.<br>Outro cliente pede para ela cobrar honorários abaixo do mínimo da tabela.<br>Ana Júlia fica em dúvida sobre qual conduta é seu dever ético.<br>Ela procura o Código de Ética para saber como agir.<br>Sobre os deveres éticos do advogado, assinale:", a:"Cobrar honorários abaixo do mínimo", b:"Guardar sigilo profissional e agir com boa-fé", c:"Divulgar segredo do cliente", d:"Aceitar causa contra ex-cliente sem cautela", correta:"B"},
{pergunta:"5. Ética - Gilson passou na OAB e quer abrir seu próprio escritório.<br>Ele não quer ter sócio, quer trabalhar sozinho em Paulista.<br>Um colega disse que ele não pode ter sociedade sozinho.<br>Outro colega disse que ele pode ter sociedade unipessoal de advocacia.<br>Gilson fica em dúvida entre sociedade unipessoal e sociedade simples.<br>Ele quer saber qual regra vale para o advogado que trabalha sozinho.<br>Sobre sociedade de advogados, assinale:", a:"Não pode constituir sociedade unipessoal", b:"Pode constituir sociedade unipessoal de advocacia", c:"Só pode se tiver 5 anos de inscrição", d:"Só pode sociedade com outro advogado", correta:"B"},
{pergunta:"6. Ética - Marina é advogada tributarista em Recife.<br>Uma empresa a contratou para prestar consultoria tributária mensal.<br>A empresa quer saber se a consultoria precisa ser por escrito.<br>Marina diz que pode ser por escrito ou verbal, se as partes acordarem.<br>A empresa não quer assinar contrato formal, só quer orientação por telefone.<br>Marina fica em dúvida se precisa de mandato ou contrato formal.<br>Sobre a consultoria jurídica, assinale:", a:"Só por escrito e com contrato", b:"Pode ser por escrito ou verbal, se as partes acordarem, mesmo sem mandato ou contrato formal", c:"Se verbal, precisa de contrato escrito", d:"Só se houver mandato", correta:"B"},
{pergunta:"7. Ética - Atena é médica e Dionísio é advogado, casados há 5 anos.<br>Eles moram em uma casa alugada no bairro de Casa Forte, em Recife.<br>Dionísio mantém seu escritório de advocacia em Olinda, onde atende clientes.<br>Ele quer saber qual é seu domicílio profissional para fins da OAB.<br>Atena diz que o domicílio é onde eles moram, pois são casados.<br>Dionísio acha que é onde ele mantém o escritório.<br>Sobre domicílio profissional do advogado, assinale:", a:"Não pode advogar onde mora", b:"Domicílio profissional é onde mantém escritório, mesmo com residência em outro local", c:"Casamento com médica impede advocacia", d:"Só pode advogar onde nasceu", correta:"B"},
{pergunta:"8. Ética - Pedro Estrela é advogado e foi preso em flagrante.<br>Ele foi acusado de participar de esquema de pirâmide financeira.<br>A prisão ocorreu em sua casa, durante a noite, sem representante da OAB.<br>Pedro se apresenta como advogado e exige a presença da OAB.<br>Os policiais dizem que não precisam chamar a OAB para prisão em flagrante.<br>Pedro quer saber qual é a regra sobre prisão de advogado.<br>Sobre prisão de advogado, assinale:", a:"Advogado só pode ser preso em flagrante por crime inafiançável, com presença de representante da OAB", b:"Pode ser preso por qualquer crime sem formalidade", c:"Não pode ser preso nunca", d:"Só com ordem do Conselho Federal", correta:"A"},
{pergunta:"9. Filosofia - Em uma aula de Filosofia do Direito, o professor cita Aristóteles.<br>Ele fala a frase: 'Quinhoar desigualmente aos desiguais, na medida em que se desigualam'.<br>Os alunos ficam confusos e perguntam o que isso significa.<br>O professor explica que igualdade não é dar tudo igual para todos.<br>Ele dá exemplo de cotas, de tributação progressiva e de acessibilidade.<br>Um aluno pergunta se isso vale para o Direito brasileiro.<br>Sobre o conceito de igualdade, assinale:", a:"Todos devem receber exatamente o mesmo", b:"Tratar igualmente os iguais e desigualmente os desiguais, na medida da desigualdade", c:"A igualdade proíbe qualquer diferença", d:"Só vale para direito penal", correta:"B"},
{pergunta:"10. Filosofia - Em prova de Filosofia, cai questão sobre Hans Kelsen.<br>O professor pergunta sobre a Teoria Pura do Direito.<br>Um aluno diz que Kelsen queria misturar Direito com moral e política.<br>Outro aluno diz que Kelsen queria estudar o Direito de forma pura.<br>O professor explica que Kelsen defendia uma ciência do Direito sem elementos estranhos.<br>Ele fala sobre hierarquia de normas e norma fundamental.<br>Sobre Hans Kelsen, assinale:", a:"Defende estudar Direito com moral e política juntas", b:"Busca estudar o Direito sem elementos estranhos, como moral, com foco na norma", c:"Negava hierarquia de normas", d:"Norma fundamental é escrita na Constituição", correta:"B"},
{pergunta:"11. Civil - Maria emprestou R$ 10 mil para João há 6 anos.<br>João nunca pagou e Maria nunca cobrou na Justiça.<br>Agora Maria quer entrar com ação cobrando a dívida.<br>João alega que o prazo já passou e houve prescrição.<br>Maria diz que prescrição não pode ser alegada pelo réu.<br>Ela também diz que prescrição atinge o direito em si.<br>Sobre prescrição e decadência, assinale:", a:"Prescrição pode ser alegada de ofício pelo juiz em qualquer caso", b:"A prescrição pode ser renunciada após consumada, expressa ou tacitamente", c:"Decadência nunca se interrompe", d:"Prescrição atinge o direito em si", correta:"B"},
{pergunta:"12. Civil - Carlos comprou um quadro achando que era de um pintor famoso.<br>Ele pagou R$ 20 mil pelo quadro, pois achava que era original.<br>Depois descobriu que era uma cópia, que valia apenas R$ 500.<br>Carlos quer anular o negócio por erro.<br>O vendedor diz que Carlos deveria ter percebido que era cópia.<br>Carlos alega que o erro foi essencial e sobre a qualidade do bem.<br>Sobre negócio jurídico e erro, assinale:", a:"Erro de cálculo sempre anula o negócio", b:"Erro sobre pessoa só anula se for essencial", c:"O erro substancial que poderia ser percebido por pessoa de diligência normal torna o negócio anulável", d:"Erro de direito nunca é relevante", correta:"C"},
{pergunta:"13. Civil - Um motorista de ônibus atropelou um pedestre em Paulista.<br>O pedestre ficou 3 meses internado e teve sequelas.<br>A empresa de ônibus diz que não teve culpa, pois o motorista era cuidadoso.<br>A vítima quer indenização por danos materiais e morais.<br>O caso foi parar na Justiça e discute responsabilidade civil.<br>A empresa alega que só responde se houver culpa.<br>Sobre responsabilidade civil, assinale:", a:"Só há responsabilidade com culpa", b:"Em regra, a responsabilidade é subjetiva, mas há casos de responsabilidade objetiva previstos em lei", c:"Dano moral nunca é indenizável", d:"Excludente de ilicitude nunca afasta dever de indenizar", correta:"B"},
{pergunta:"14. Civil - Ana assinou contrato de aluguel com cláusula abusiva.<br>O contrato diz que ela não pode reclamar de nenhum defeito no imóvel.<br>O contrato também diz que o locador pode aumentar o aluguel a qualquer momento.<br>Ana quer saber se o contrato é válido mesmo com essas cláusulas.<br>Ela alega que o contrato deve respeitar a função social.<br>O locador diz que contrato é lei entre as partes e deve ser cumprido.<br>Sobre contratos, assinale:", a:"Contrato só vale se for escrito", b:"A função social do contrato limita a liberdade de contratar", c:"Contrato de adesão não pode ser interpretado a favor do aderente", d:"Cláusula abusiva nunca pode ser anulada", correta:"B"},
{pergunta:"15. Civil - José ocupa um terreno há 5 anos, com casa construída.<br>Ele comprou o terreno de boa-fé, achando que o vendedor era o dono.<br>José plantou árvores, colheu frutos e fez benfeitorias no terreno.<br>O verdadeiro dono apareceu e quer o terreno de volta.<br>José quer ser indenizado pelas benfeitorias e ficar com os frutos.<br>O dono alega que José não é dono e não tem direito a nada.<br>Sobre posse, assinale:", a:"Posse é só de quem é dono", b:"Possuidor de boa-fé tem direito aos frutos percebidos e a indenização por benfeitorias", c:"Posse nunca se transmite", d:"Esbulho não gera proteção possessória", correta:"B"},
{pergunta:"16. Constitucional - Um cidadão foi impedido de entrar em uma praça pública.<br>Ele alega que tem direito de ir e vir e de liberdade de expressão.<br>A Prefeitura diz que direitos fundamentais só valem contra o Estado.<br>O cidadão diz que direitos fundamentais valem contra todos.<br>Ele quer saber se pode invocar direitos fundamentais contra particulares.<br>O caso discute a eficácia dos direitos fundamentais.<br>Sobre direitos fundamentais, assinale:", a:"Os direitos fundamentais têm aplicação imediata e podem ser invocados contra o Estado e particulares", b:"Direitos fundamentais só valem contra o Estado", c:"Nenhum direito fundamental pode ser limitado", d:"Direitos sociais não são fundamentais", correta:"A"},
{pergunta:"17. Constitucional - Um juiz de primeira instância afastou uma lei em um caso concreto.<br>Ele entendeu que a lei era inconstitucional e não a aplicou no caso.<br>As partes questionam se o juiz pode fazer controle de constitucionalidade.<br>O juiz explica que no controle difuso qualquer juiz pode afastar lei inconstitucional.<br>Uma das partes diz que só o STF pode fazer isso.<br>O caso discute controle difuso e concentrado.<br>Sobre controle de constitucionalidade, assinale:", a:"No controle difuso, qualquer juiz pode afastar lei inconstitucional no caso concreto", b:"Só o STF pode fazer controle difuso", c:"Controle concentrado é feito por qualquer juiz", d:"ADI só pode ser proposta pelo Presidente", correta:"A"},
{pergunta:"18. Constitucional - A União, um Estado e um Município querem legislar sobre o mesmo tema.<br>O tema é direito civil, que envolve contratos e obrigações.<br>O Município quer criar lei sobre contratos, o Estado também.<br>A União diz que ela tem competência para normas gerais.<br>Os três entes ficam em dúvida sobre quem pode legislar.<br>O caso discute repartição de competências.<br>Sobre repartição de competências, assinale:", a:"Município pode legislar sobre direito penal", b:"Compete à União, Estados e DF legislar concorrentemente sobre direito civil, com normas gerais da União", c:"Estado não pode legislar sobre nada", d:"União tem competência exclusiva para tudo", correta:"B"},
{pergunta:"19. Constitucional - Um juiz foi acusado de cometer falta grave.<br>O Tribunal quer afastá-lo, mas o juiz alega que tem garantias.<br>Ele diz que tem vitaliciedade, inamovibilidade e irredutibilidade de subsídio.<br>O Tribunal diz que pode afastá-lo sem processo.<br>O juiz alega que só pode ser afastado com processo e garantias.<br>O caso discute garantias da magistratura.<br>Sobre Poder Judiciário, assinale:", a:"Juiz pode ser afastado sem processo", b:"Magistratura é vitalícia desde a posse", c:"São garantias da magistratura: vitaliciedade, inamovibilidade e irredutibilidade de subsídio", d:"Tribunal não pode julgar seus membros", correta:"C"},
{pergunta:"20. Administrativo - A Prefeitura de Paulista anulou uma licença que tinha concedido.<br>A licença era ilegal, pois foi concedida sem observar a lei.<br>O beneficiado alega que tem direito adquirido e não pode ser anulada.<br>A Prefeitura diz que pode anular seus atos ilegais.<br>Ela também diz que pode revogar atos inconvenientes.<br>O caso discute anulação e revogação de ato administrativo.<br>Sobre ato administrativo, assinale:", a:"Ato administrativo nunca pode ser anulado", b:"A Administração pode anular seus atos ilegais e revogar os inconvenientes, respeitados direitos adquiridos", c:"Ato vinculado não pode ser controlado", d:"Motivo do ato nunca importa", correta:"B"},
{pergunta:"21. Administrativo - A Prefeitura de Olinda quer comprar 100 computadores.<br>Ela abre licitação para escolher a melhor proposta.<br>Uma empresa alega que foi preterida sem motivo.<br>A Prefeitura diz que licitação só serve para comprar bens.<br>A empresa diz que licitação busca isonomia e melhor proposta.<br>O caso discute os objetivos da licitação.<br>Sobre licitação, assinale:", a:"A licitação busca selecionar a proposta mais vantajosa e garantir isonomia entre concorrentes", b:"Licitação só serve para comprar bens", c:"Pode haver licitação sem publicidade", d:"Vence sempre o menor preço, sem exceção", correta:"A"},
{pergunta:"22. Administrativo - Carlos é servidor público concursado há 2 anos.<br>Ele quer saber quando vai adquirir estabilidade.<br>Um colega diz que estabilidade é adquirida com 3 anos e avaliação.<br>Outro colega diz que cargo em comissão tem estabilidade.<br>Carlos fica em dúvida sobre as regras da estabilidade.<br>Ele procura a Constituição para saber.<br>Sobre servidores públicos, assinale:", a:"Servidor estável nunca pode ser demitido", b:"A estabilidade é adquirida após 3 anos de efetivo exercício e aprovação em avaliação", c:"Cargo em comissão tem estabilidade", d:"Servidor temporário tem estabilidade", correta:"B"},
{pergunta:"23. Administrativo - Um agente público causou acidente com carro oficial.<br>Ele bateu em um carro particular e causou danos.<br>A vítima quer indenização do Estado.<br>O Estado diz que só responde se houver culpa do agente.<br>A vítima alega que o Estado responde objetivamente.<br>O Estado quer cobrar do agente se houver dolo ou culpa.<br>Sobre responsabilidade do Estado, assinale:", a:"O Estado responde objetivamente pelos danos causados por seus agentes, assegurado direito de regresso em caso de dolo ou culpa", b:"Estado só responde se houver culpa", c:"Estado nunca responde por omissão", d:"Agente nunca responde pessoalmente", correta:"A"},
{pergunta:"24. Tributário - O Governo criou um novo imposto por medida provisória.<br>O imposto começou a ser cobrado no mesmo mês, sem lei anterior.<br>Um contribuinte questiona a cobrança, alegando falta de legalidade.<br>Ele diz que não pode cobrar tributo sem lei que o estabeleça.<br>O Governo diz que pode cobrar tributo sem lei em alguns casos.<br>O caso discute princípios tributários.<br>Sobre princípios tributários, assinale:", a:"Pode cobrar tributo retroativo", b:"Tributo pode ser confiscatório", c:"É vedado cobrar tributo sem lei que o estabeleça, salvo exceções constitucionais", d:"Imposto pode ser cobrado sem anterioridade", correta:"C"},
{pergunta:"25. Tributário - Uma igreja questiona cobrança de IPTU sobre seu templo.<br>A Prefeitura cobra IPTU, mas a igreja alega imunidade.<br>A Prefeitura diz que imunidade é isenção concedida por lei.<br>A igreja diz que imunidade é limitação constitucional.<br>Ela alega que não pode ser revogada por lei ordinária.<br>O caso discute imunidade tributária.<br>Sobre imunidade tributária, assinale:", a:"Imunidade é isenção concedida por lei", b:"Imunidade pode ser revogada por lei ordinária", c:"Imunidade é igual a não incidência", d:"A imunidade é limitação constitucional ao poder de tributar", correta:"D"},
{pergunta:"26. Tributário - João vendeu um imóvel e recebeu cobrança de ITBI.<br>A Prefeitura fez o lançamento do tributo e cobrou o valor.<br>João diz que o crédito tributário nasce com a lei.<br>A Prefeitura diz que o lançamento constitui o crédito.<br>João quer saber quando o crédito se torna exigível.<br>O caso discute crédito tributário.<br>Sobre crédito tributário, assinale:", a:"Crédito tributário nasce com a lei", b:"Lançamento é facultativo", c:"O lançamento constitui o crédito tributário, tornando-o exigível", d:"Crédito tributário nunca prescreve", correta:"C"},
{pergunta:"27. Penal - Pedro foi acusado de cometer crime que não estava previsto em lei.<br>O Ministério Público quer condená-lo por analogia.<br>Pedro alega que não há crime sem lei anterior que o defina.<br>Ele diz que não pode haver pena sem prévia cominação legal.<br>O juiz fica em dúvida se pode condenar por costume.<br>O caso discute aplicação da lei penal.<br>Sobre aplicação da lei penal, assinale:", a:"Lei penal pode retroagir para prejudicar", b:"Costume pode criar crime", c:"Analogia pode criar crime", d:"Não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal", correta:"D"},
{pergunta:"28. Penal - Lucas, com 17 anos, cometeu um furto em Paulista.<br>Ele foi apreendido e encaminhado à Justiça da Infância.<br>O Ministério Público quer que ele seja julgado como adulto.<br>Lucas alega que é inimputável por ser menor de 18 anos.<br>Ele também alega erro de proibição inevitável.<br>O caso discute culpabilidade.<br>Sobre culpabilidade, assinale:", a:"Culpabilidade é igual a dolo", b:"Menor de 18 anos é imputável", c:"São excludentes de culpabilidade: inimputabilidade, erro de proibição inevitável e inexigibilidade de conduta diversa", d:"Embriaguez voluntária sempre exclui culpa", correta:"C"},
{pergunta:"29. Penal - Carlos matou seu desafeto por motivo fútil.<br>Ele matou porque a vítima olhou feio para ele em um bar.<br>O Ministério Público denunciou por homicídio qualificado.<br>Carlos alega que homicídio culposo tem pena maior que doloso.<br>A defesa diz que lesão corporal leve é inafiançável.<br>O caso discute crimes contra a pessoa.<br>Sobre crimes contra a pessoa, assinale:", a:"Homicídio culposo tem pena maior que doloso", b:"O homicídio qualificado por motivo fútil tem pena maior que o simples", c:"Lesão corporal leve é crime inafiançável", d:"Não há tentativa em crime culposo doloso", correta:"B"},
{pergunta:"30. Penal - Paulo foi condenado por furto há 10 anos.<br>Ele nunca cumpriu a pena e ficou foragido.<br>Agora ele foi preso e alega prescrição.<br>Ele diz que a prescrição extingue a punibilidade.<br>O Ministério Público diz que crime hediondo nunca prescreve.<br>O caso discute prescrição penal.<br>Sobre prescrição penal, assinale:", a:"Prescrição nunca corre", b:"Prescrição só beneficia réu rico", c:"A prescrição extingue a punibilidade e pode ocorrer antes ou depois do trânsito em julgado", d:"Crime hediondo nunca prescreve", correta:"C"},
{pergunta:"31. Processo Penal - A polícia abriu inquérito para apurar um roubo em Paulista.<br>O delegado ouviu testemunhas e apreendeu objetos.<br>O indiciado quer ter contraditório pleno no inquérito.<br>Ele alega que inquérito é processo judicial.<br>O delegado diz que inquérito é dispensável e sigiloso.<br>O caso discute natureza do inquérito policial.<br>Sobre inquérito policial, assinale:", a:"Inquérito é processo judicial", b:"Inquérito é indispensável para ação penal", c:"Defesa tem direito ao contraditório pleno no inquérito", d:"O inquérito policial é procedimento administrativo, inquisitivo, dispensável e sigiloso", correta:"D"},
{pergunta:"32. Processo Penal - João foi preso por roubo e o juiz vai decidir sobre prisão preventiva.<br>O Ministério Público pede prisão para garantia da ordem pública.<br>João alega que prisão preventiva pode ser decretada sem requisito.<br>A defesa diz que só pode ser decretada na sentença.<br>O juiz explica que precisa de prova do crime e indício de autoria.<br>O caso discute prisão preventiva.<br>Sobre prisão preventiva, assinale:", a:"Pode ser decretada para garantia da ordem pública, conveniência da instrução e aplicação da lei penal, desde que haja prova do crime e indício de autoria", b:"Pode ser decretada sem nenhum requisito", c:"Só pode ser decretada na sentença", d:"Nunca pode ser revogada", correta:"A"},
{pergunta:"33. Processo Penal - A polícia gravou conversa de réu sem autorização judicial.<br>A gravação mostra o réu confessando o crime.<br>O Ministério Público quer usar a gravação como prova.<br>A defesa alega que a prova é ilícita e não pode ser usada.<br>O juiz fica em dúvida se prova ilícita pode ser usada se for boa.<br>O caso discute provas ilícitas.<br>Sobre provas, assinale:", a:"Prova ilícita pode ser usada se for boa", b:"Juiz deve condenar sem provas", c:"Testemunha não precisa de compromisso", d:"São inadmissíveis as provas obtidas por meios ilícitos", correta:"D"},
{pergunta:"34. Processo Civil - Maria entrou com ação de divórcio em Recife.<br>Paulo alega que o juiz não é competente para julgar.<br>Maria diz que qualquer juiz pode julgar qualquer causa.<br>Paulo diz que competência em razão da matéria é absoluta.<br>O juiz explica que competência absoluta não pode ser prorrogada.<br>O caso discute jurisdição e competência.<br>Sobre jurisdição e competência, assinale:", a:"Qualquer juiz pode julgar qualquer causa", b:"Competência pode ser alterada por vontade das partes sempre", c:"A competência em razão da matéria e hierárquica é absoluta e não pode ser prorrogada", d:"Competência relativa nunca pode ser alegada", correta:"C"},
{pergunta:"35. Processo Civil - João foi citado em uma ação e tem prazo para contestar.<br>Ele quer saber como contar o prazo processual.<br>Um colega diz que prazo é sempre de 5 dias.<br>Outro diz que prazo não se suspende nunca.<br>João procura o CPC e descobre que prazos são em dias úteis.<br>Ele descobre que exclui o dia do começo e inclui o do vencimento.<br>Sobre prazos processuais, assinale:", a:"Prazo em dobro nunca existe", b:"Prazo processual é sempre de 5 dias", c:"Os prazos processuais são contados em dias úteis, excluído o dia do começo e incluído o do vencimento", d:"Prazo não se suspende nunca", correta:"C"},
{pergunta:"36. Processo Civil - O juiz proferiu sentença sem fundamentação em um caso.<br>As partes questionam a validade da sentença.<br>Uma parte diz que sentença pode ser sem fundamentação.<br>Outra diz que sentença sem dispositivo é válida.<br>O juiz explica que sentença deve ser fundamentada sob pena de nulidade.<br>O caso discute requisitos da sentença.<br>Sobre sentença, assinale:", a:"Sentença pode ser proferida sem fundamentação", b:"Sentença sem dispositivo é válida", c:"Sentença pode julgar além do pedido", d:"A sentença deve ser fundamentada, sob pena de nulidade", correta:"D"},
{pergunta:"37. Processo Civil - Carlos quer recorrer de uma sentença.<br>Ele quer saber quais são os pressupostos recursais.<br>Um colega diz que recurso pode ser interposto a qualquer tempo.<br>Outro diz que recurso não precisa de preparo nunca.<br>Carlos descobre que precisa de cabimento, legitimidade, interesse, tempestividade.<br>Ele também descobre que precisa de preparo e regularidade formal.<br>Sobre recursos, assinale:", a:"Recurso pode ser interposto a qualquer tempo", b:"Recurso não precisa de preparo nunca", c:"Recurso sem interesse é admissível", d:"São pressupostos recursais: cabimento, legitimidade, interesse, tempestividade, preparo e regularidade formal", correta:"D"},
{pergunta:"38. Trabalho - Maria trabalha em uma padaria há 2 anos sem carteira assinada.<br>Ela trabalha todos os dias, com horário fixo e salário mensal.<br>O patrão diz que ela não é empregada porque não tem contrato escrito.<br>Maria alega que contrato pode ser tácito, verbal ou escrito.<br>Ela quer ter seus direitos reconhecidos na Justiça do Trabalho.<br>O patrão diz que empregado doméstico não tem direitos.<br>Sobre contrato de trabalho, assinale:", a:"Contrato de trabalho só vale se for escrito", b:"O contrato de trabalho pode ser tácito ou expresso, verbal ou escrito, por prazo determinado ou indeterminado", c:"Empregado doméstico não tem direitos", d:"Jornada de trabalho não tem limite", correta:"B"},
{pergunta:"39. Trabalho - João foi demitido sem justa causa após 3 anos.<br>Ele quer saber quais verbas rescisórias tem direito.<br>A empresa diz que ele não tem direito a verbas rescisórias.<br>João alega que tem direito a aviso prévio, férias + 1/3, 13º.<br>Ele também alega que tem direito a FGTS + 40% e seguro-desemprego.<br>O caso foi parar na Justiça do Trabalho.<br>Sobre rescisão, assinale:", a:"Empregado nunca tem direito a verbas rescisórias", b:"Justa causa não precisa de motivo", c:"Aviso prévio nunca é devido", d:"Na dispensa sem justa causa, o empregado tem direito a aviso prévio, férias + 1/3, 13º proporcional, FGTS + 40% e seguro-desemprego", correta:"D"},
{pergunta:"40. Trabalho - Ana trabalha 10 horas por dia sem receber hora extra.<br>Ela trabalha de segunda a sábado, sem intervalo.<br>O patrão diz que jornada pode ser de 16 horas sem adicional.<br>Ana alega que jornada normal é de 8h diárias e 44 semanais.<br>Ela diz que hora extra deve ser paga com adicional.<br>O caso discute jornada de trabalho.<br>Sobre jornada, assinale:", a:"A jornada normal é de 8 horas diárias e 44 semanais, com horas extras limitadas e pagas com adicional", b:"Jornada pode ser de 16 horas sem adicional", c:"Hora extra não precisa ser paga", d:"Intervalo intrajornada nunca é obrigatório", correta:"A"},
{pergunta:"41. Empresarial - Carlos é dono de uma pequena padaria em Paulista/PE.<br>Ele vende pães todos os dias, tem 3 empregados registrados,<br>compra farinha de um fornecedor e revende os pães com lucro.<br>Ele está pensando em abrir uma filial e quer saber se ele é empresário.<br>Ele exerce atividade econômica organizada para produção de bens,<br>com habitualidade e intuito de lucro.<br>Segundo o Código Civil, Carlos é considerado empresário?", a:"Não, porque padaria não é empresa", b:"Não, porque tem poucos empregados", c:"Não, porque não tem CNPJ", d:"Sim, pois exerce profissionalmente atividade econômica organizada para produção ou circulação de bens ou serviços", correta:"D"},
{pergunta:"42. Empresarial - Mariana abriu uma loja de roupas no centro.<br>Ela comprou o ponto comercial, as prateleiras, o estoque e a marca.<br>Depois de 6 meses, ela vendeu tudo para João, incluindo o nome da loja.<br>João continuou vendendo as mesmas roupas, no mesmo lugar,<br>com os mesmos clientes, sem mudar nada na fachada.<br>Mariana ainda devia R$ 10 mil para um fornecedor de tecidos.<br>Sobre a venda do estabelecimento comercial, o que acontece com a dívida?", a:"João não responde por nada", b:"Mariana continua sozinha, sem sucessão", c:"A venda é nula", d:"João responde pelas dívidas anteriores, desde que regularmente contabilizadas, havendo sucessão no estabelecimento", correta:"D"},
{pergunta:"43. Consumidor - Paulo comprou um celular novo em uma loja por R$ 3.000.<br>Com 10 dias de uso, o celular parou de ligar sozinho, sem queda ou mau uso.<br>Paulo voltou na loja e pediu a troca imediata, mas a loja disse:<br>'Tem que mandar para assistência, espera 30 dias'.<br>Paulo ficou sem celular para trabalhar, pois usa para entregas.<br>Ele quer saber se precisa mesmo esperar os 30 dias.<br>Segundo o CDC, sobre vício do produto, assinale a correta:", a:"Em caso de vício, o consumidor pode exigir a troca, devolução ou abatimento após 30 dias sem conserto, salvo produto essencial ou vício que torne impróprio o uso", b:"Consumidor nunca pode pedir troca", c:"Loja pode esperar 90 dias", d:"Só pode pedir conserto", correta:"A"},
{pergunta:"44. Consumidor - Ana contratou um plano de internet de 500 MB.<br>A operadora prometeu instalação em 5 dias, mas demorou 40 dias.<br>Durante esse tempo, Ana ficou sem internet e perdeu clientes da sua loja online.<br>Ela ligou várias vezes, anotou protocolos, mas ninguém resolveu.<br>Ela quer cancelar sem multa e ser indenizada pelo tempo sem serviço.<br>Sobre práticas abusivas e direito do consumidor, assinale:", a:"Operadora pode demorar quanto quiser", b:"O fornecedor responde pela má prestação do serviço, devendo reparar os danos e o consumidor pode pedir rescisão e restituição", c:"Ana tem que pagar multa para cancelar", d:"Protocolo não serve como prova", correta:"B"},
{pergunta:"45. Ambiental - Uma fábrica em Pernambuco joga resíduos químicos no rio.<br>Os moradores da região começaram a ter problemas de saúde,<br>os peixes morreram e a água ficou imprópria para consumo.<br>O Ministério Público entrou com ação pedindo a reparação do dano.<br>A fábrica alegou que não teve culpa, que foi um acidente.<br>Ela diz que instalou filtros, mas os filtros falharam sem querer.<br>Sobre responsabilidade ambiental, assinale a correta:", a:"A responsabilidade civil por dano ambiental é objetiva, independe de culpa, bastando dano e nexo causal", b:"Só responde se houver culpa provada", c:"Acidente exclui responsabilidade", d:"Só o poder público pode ser responsabilizado", correta:"A"},
{pergunta:"46. Tributário - João tem uma casa avaliada em R$ 400 mil.<br>Ele recebeu uma cobrança de IPTU de R$ 8 mil, sendo que no ano anterior era R$ 2 mil.<br>A prefeitura aumentou a base de cálculo por decreto, sem lei nova.<br>João acha o aumento abusivo e quer questionar na Justiça.<br>Ele não quer pagar até resolver, mas tem medo de multa.<br>Sobre o aumento do IPTU, assinale a correta:", a:"A majoração da base de cálculo do IPTU depende de lei, não podendo ser feita por simples decreto que aumente o tributo", b:"Prefeitura pode aumentar por decreto", c:"João tem que pagar sem questionar", d:"IPTU não tem base de cálculo", correta:"A"},
{pergunta:"47. Penal - Lucas, com 19 anos, estava em uma festa.<br>Ele discutiu com Rafael por causa de uma garrafa de bebida.<br>Com raiva, Lucas pegou uma faca e desferiu um golpe em Rafael,<br>que caiu ferido e precisou de cirurgia de emergência.<br>Lucas fugiu, mas foi preso no dia seguinte em casa.<br>A vítima sobreviveu, mas ficou 30 dias internada.<br>Sobre o crime praticado por Lucas, assinale a correta:", a:"É homicídio consumado", b:"É lesão corporal leve", c:"É tentativa de homicídio, pois ele quis matar e só não conseguiu por circunstâncias alheias à sua vontade", d:"Não é crime porque foi em festa", correta:"C"},
{pergunta:"48. Penal - Fernanda é caixa da Caixa Econômica Federal, em Recife.<br>Ela é funcionária pública federal e trabalha como caixa há 5 anos.<br>Todos os dias ela recebe dinheiro dos clientes para depósito.<br>Durante 3 meses, ela desviou R$ 50 mil, pegando pequenas quantias.<br>Ela usou o dinheiro para pagar dívidas de cartão e viagens.<br>Quando o banco fez auditoria, descobriu o desvio pelos registros.<br>Sobre o crime cometido por Fernanda, assinale:", a:"É furto simples", b:"É estelionato", c:"É apropriação indébita", d:"É peculato, pois ela, sendo funcionária pública, tinha a posse do dinheiro em razão do cargo e se apropriou dele", correta:"D"},
{pergunta:"49. Civil - Pedro e Maria são casados há 10 anos.<br>Eles compraram um apartamento juntos, financiado em nome dos dois.<br>Pedro quer vender o apartamento sozinho, sem falar com Maria.<br>Maria diz que não concorda, pois o bem é dos dois.<br>Pedro alega que ele paga a maior parte das parcelas.<br>O comprador quer saber se a venda é válida sem a assinatura de Maria.<br>Sobre a venda de bem imóvel de casal, assinale:", a:"É necessária a outorga conjugal para vender imóvel, salvo regime de separação absoluta, sob pena de anulabilidade", b:"Pedro pode vender sozinho", c:"Quem paga mais pode vender sozinho", d:"Não precisa de assinatura para imóvel financiado", correta:"A"},
{pergunta:"50. Civil - José emprestou R$ 20 mil para seu amigo Antônio.<br>Antônio prometeu pagar em 6 meses, com juros de 5% ao mês.<br>José aceitou e fez um contrato escrito, com testemunhas.<br>Depois de 6 meses, Antônio não pagou nada, alegando que os juros eram altos.<br>José entrou na Justiça cobrando o valor com juros e correção.<br>Antônio alega que o contrato é abusivo e não quer pagar nada.<br>Sobre juros e contrato de mútuo, assinale:", a:"Contrato é nulo, Antônio não paga nada", b:"Os juros devem respeitar os limites legais, mas o contrato é válido e Antônio deve pagar o principal com juros legais e correção, afastado o excesso abusivo", c:"José pode cobrar 20% ao mês", d:"Mútuo verbal não vale", correta:"B"},
{pergunta:"51. Trabalho - Juliana trabalha em uma loja de shopping há 2 anos.<br>Ela cumpre jornada de 8h por dia, de segunda a sábado, com 1h de almoço.<br>Nos últimos 3 meses, ela passou a fazer 2h extras todos os dias, sem receber.<br>A loja alega que ela fazia hora extra porque queria, não porque foi mandada.<br>Juliana tem os registros de ponto e mensagens do gerente pedindo para ficar.<br>Ela quer receber as horas extras com adicional.<br>Sobre horas extras, assinale a correta:", a:"Hora extra só vale se for autorizada por escrito", b:"Empregado que faz hora extra por vontade própria não recebe", c:"Registro de ponto não serve como prova", d:"As horas extras habitualmente prestadas devem ser pagas com adicional de no mínimo 50%, ainda que não haja acordo escrito, se comprovada a prestação", correta:"D"},
{pergunta:"52. Trabalho - Roberto foi demitido por justa causa.<br>A empresa alegou que ele faltou 5 vezes sem justificar em um mês.<br>Roberto diz que faltou porque estava doente, mas não entregou atestado.<br>A empresa não fez advertência antes, demitiu direto.<br>Roberto entrou na Justiça pedindo reversão da justa causa.<br>Ele alega que a punição foi desproporcional e sem gradação.<br>Sobre justa causa, assinale a correta:", a:"Justa causa pode ser aplicada sem prova", b:"Falta sem atestado nunca é justa causa", c:"Empresa pode demitir por justa causa sem advertência em qualquer caso", d:"A justa causa exige prova robusta, gravidade, imediatidade e proporcionalidade, devendo ser analisada a gradação da pena", correta:"D"},
{pergunta:"53. Constitucional - O Município de Paulista editou lei proibindo a venda de bebidas.<br>A lei municipal proibiu a venda em todo o território do município, a qualquer hora.<br>Um comerciante questionou a lei, dizendo que o Município não pode legislar sobre isso.<br>Ele alega que a competência para legislar sobre comércio é da União.<br>O Município alega que é assunto de interesse local e saúde pública.<br>O caso foi parar no Tribunal de Justiça.<br>Sobre competência legislativa municipal, assinale:", a:"Município nunca pode legislar sobre comércio", b:"O Município pode legislar sobre assuntos de interesse local e suplementar a legislação federal e estadual no que couber", c:"Município só pode legislar sobre IPTU", d:"Lei municipal é sempre inconstitucional", correta:"B"},
{pergunta:"54. Constitucional - Um Deputado Federal foi preso em flagrante por crime inafiançável.<br>A prisão ocorreu durante a sessão legislativa, em Brasília.<br>A Câmara dos Deputados foi comunicada em 24 horas, como manda a Constituição.<br>Os deputados vão votar se mantêm ou não a prisão do parlamentar.<br>O deputado alega que tem imunidade e não pode ser preso de jeito nenhum.<br>O caso gerou debate sobre imunidade parlamentar.<br>Sobre imunidade parlamentar, assinale:", a:"Deputado nunca pode ser preso", b:"Deputado só pode ser preso em flagrante de crime inafiançável, devendo os autos serem remetidos à Casa para deliberar sobre a prisão", c:"Imunidade é absoluta para qualquer crime", d:"Câmara não pode deliberar sobre prisão", correta:"B"},
{pergunta:"55. Administrativo - A Prefeitura de Olinda abriu concurso para 20 vagas de professor.<br>Durante o concurso, a Prefeitura nomeou 10 pessoas aprovadas fora do concurso.<br>Os candidatos aprovados entraram na Justiça pedindo a nomeação.<br>Eles alegam que têm direito à nomeação, pois foram aprovados dentro das vagas.<br>A Prefeitura alega que pode nomear quem quiser, por conveniência.<br>O caso foi julgado pelo STF.<br>Sobre concurso público, assinale:", a:"Aprovado em concurso nunca tem direito à nomeação", b:"Prefeitura pode nomear quem quiser", c:"O candidato aprovado dentro do número de vagas tem direito subjetivo à nomeação, não podendo a Administração preterir por nomeação precária", d:"Concurso só serve para cadastro de reserva", correta:"C"},
{pergunta:"56. Administrativo - Maria é servidora pública estável há 10 anos.<br>Ela foi acusada de ter recebido propina de um fornecedor da Prefeitura.<br>Foi aberto processo administrativo disciplinar, com direito à defesa.<br>No processo, ficou provado que ela recebeu R$ 5 mil para favorecer a empresa.<br>A comissão sugeriu demissão, mas Maria alega que é estável e não pode ser demitida.<br>Ela diz que estabilidade é garantia absoluta.<br>Sobre estabilidade e demissão, assinale:", a:"O servidor estável pode ser demitido mediante processo administrativo disciplinar em que lhe seja assegurada ampla defesa, em caso de falta grave", b:"Servidor estável nunca pode ser demitido", c:"Demissão só pode ser feita pelo Prefeito sem processo", d:"Estabilidade impede qualquer punição", correta:"A"},
{pergunta:"57. Tributário - Uma empresa de Recife vende produtos pela internet para todo o Brasil.<br>Ela paga ICMS no seu Estado de origem, mas os Estados de destino também cobram.<br>A empresa alega bitributação, pois está pagando duas vezes o mesmo imposto.<br>Ela entrou na Justiça pedindo a devolução de um dos pagamentos.<br>Os Estados alegam que cada um tem direito de cobrar.<br>O caso discute a repartição do ICMS no comércio eletrônico.<br>Sobre bitributação e ICMS, assinale:", a:"Bitributação é permitida", b:"Empresa tem que pagar duas vezes", c:"ICMS não incide em venda pela internet", d:"É vedada a bitributação, devendo o ICMS ser repartido conforme regras constitucionais entre Estado de origem e destino", correta:"D"},
{pergunta:"58. Tributário - Carlos importou um carro de luxo dos Estados Unidos.<br>A Receita Federal cobrou Imposto de Importação de 35% sobre o valor do carro.<br>Carlos achou o valor alto e quis questionar, dizendo que não houve lei.<br>A Receita mostrou que o imposto está previsto na Constituição e no Código Tributário.<br>Carlos alega que imposto de importação não precisa de lei para aumentar.<br>Ele quer pagar apenas 10%, como era no ano anterior.<br>Sobre Imposto de Importação, assinale:", a:"Imposto de Importação pode ser aumentado sem lei", b:"Imposto de Importação não existe", c:"O Imposto de Importação pode ter alíquota alterada pelo Poder Executivo, dentro dos limites legais, por ser imposto extrafiscal", d:"Só o Congresso pode alterar alíquota", correta:"C"},
{pergunta:"59. Processo Civil - João entrou com ação cobrando R$ 50 mil de Pedro.<br>Pedro foi citado, mas não apresentou contestação no prazo de 15 dias.<br>O juiz decretou a revelia e julgou o pedido procedente.<br>Pedro alega que não foi citado corretamente, pois estava viajando.<br>Ele entrou com recurso, dizendo que a citação foi feita em endereço errado.<br>O processo mostra que a citação foi feita em endereço antigo.<br>Sobre revelia, assinale:", a:"Revelia nunca pode ser revertida", b:"Revelia significa que o réu perdeu tudo automaticamente", c:"Citação válida é pressuposto para revelia, sendo nula a citação feita em endereço errado sem esgotar meios de localização", d:"Réu revel não pode recorrer", correta:"D"},
{pergunta:"60. Processo Civil - Ana entrou com ação de divórcio contra Paulo.<br>Na audiência, eles fizeram acordo sobre guarda dos filhos e partilha.<br>O juiz homologou o acordo e extinguiu o processo com resolução de mérito.<br>Depois de 1 mês, Paulo quis voltar atrás, dizendo que foi pressionado.<br>Ana alega que o acordo já foi homologado e não pode ser desfeito.<br>Paulo entrou com ação rescisória.<br>Sobre acordo homologado, assinale:", a:"O acordo homologado por sentença faz coisa julgada material, só podendo ser desconstituído por ação rescisória nos casos legais", b:"Acordo pode ser desfeito a qualquer momento", c:"Juiz não pode homologar acordo", d:"Acordo homologado não tem valor", correta:"A"},
{pergunta:"61. Ética - Ricardo é advogado e foi procurado por dois clientes com interesses opostos.<br>Os dois querem que ele atue no mesmo processo, um contra o outro.<br>Ricardo acha que pode atender os dois, pois conhece bem o caso.<br>Ele marcou reunião com os dois juntos para tentar um acordo.<br>Um dos clientes desconfia e pergunta se isso é permitido.<br>Ricardo diz que não há problema, pois ele é imparcial.<br>Sobre conflito de interesses na advocacia, assinale:", a:"Advogado pode defender os dois lados se for imparcial", b:"Advogado pode defender os dois se eles concordarem", c:"Advogado pode defender os dois se for acordo", d:"O advogado não pode atuar em causa em que há conflito de interesses, devendo recusar um dos patrocínios e preservar o sigilo", correta:"D"},
{pergunta:"62. Ética - Camila é advogada e fez publicidade no Instagram.<br>Ela postou: 'Garanto que você vai ganhar sua causa! Promoção!'.<br>Ela também colocou valores de honorários e fotos de clientes.<br>A OAB foi comunicada e abriu processo ético contra ela.<br>Camila alega que é liberdade de expressão e marketing digital.<br>Ela diz que todo mundo faz isso nas redes sociais.<br>Sobre publicidade na advocacia, assinale:", a:"Publicidade pode garantir resultado", b:"Advogado pode divulgar valores como promoção", c:"A publicidade deve ser sóbria, sem mercantilização, sem promessa de resultado e sem exposição de clientes, sob pena de infração ética", d:"Instagram não é controlado pela OAB", correta:"C"},
{pergunta:"63. Civil - André comprou um carro de Bruno por R$ 60 mil.<br>André pagou à vista, mas Bruno não entregou o documento do carro.<br>André descobriu que o carro tinha multa de R$ 10 mil e alienação fiduciária.<br>Bruno disse que não sabia de nada e que vendeu de boa-fé.<br>André quer desfazer o negócio e receber o dinheiro de volta.<br>Ele entrou na Justiça pedindo rescisão e indenização.<br>Sobre vício redibitório e evicção, assinale:", a:"O comprador que adquire bem com vício oculto que o torna impróprio ao uso pode pedir redibição ou abatimento do preço, além de indenização se o vendedor conhecia o vício", b:"Comprador nunca pode desfazer negócio", c:"Vício oculto não gera direito", d:"Só pode pedir abatimento, nunca rescisão", correta:"A"},
{pergunta:"64. Civil - Luiza e Felipe são vizinhos em Paulista.<br>Felipe construiu um muro que invadiu 1 metro do terreno de Luiza.<br>Luiza pediu para ele demolir, mas Felipe se recusou.<br>Ele alega que já construiu há 2 anos e ninguém reclamou.<br>Luiza entrou com ação demolitória e de indenização.<br>O perito confirmou que o muro está dentro do terreno de Luiza.<br>Sobre direito de vizinhança e construção, assinale:", a:"O proprietário pode exigir a demolição de construção que invade seu terreno, ainda que o vizinho alegue tempo, salvo usucapião comprovada", b:"Vizinho pode invadir se for pouco", c:"Depois de 1 ano não pode mais reclamar", d:"Luiza tem que pagar pelo muro", correta:"A"},
{pergunta:"65. Constitucional - A União editou lei criando novo tributo sobre grandes fortunas.<br>A lei foi aprovada pelo Congresso e sancionada pelo Presidente.<br>Um contribuinte questionou a lei, dizendo que ela é inconstitucional.<br>Ele alega que o tributo não respeitou a anterioridade e a legalidade.<br>O caso chegou ao STF por meio de Ação Direta de Inconstitucionalidade.<br>O STF vai julgar se a lei respeita a Constituição.<br>Sobre controle concentrado, assinale:", a:"ADI só pode ser proposta por cidadão", b:"ADI só serve para lei estadual", c:"No controle concentrado, o STF julga a lei em tese, com efeito erga omnes e vinculante, quando proposta por legitimado", d:"STF não pode julgar lei federal", correta:"C"},
{pergunta:"66. Penal - Thiago foi flagrado dirigindo embriagado em Paulista.<br>Ele bateu em um poste e foi levado para a delegacia.<br>No bafômetro, deu 0,8 mg/L de álcool no sangue.<br>Thiago alega que só tomou duas cervejas e que não causou acidente com vítima.<br>Ele diz que não pode ser preso porque não machucou ninguém.<br>A polícia prendeu em flagrante e encaminhou ao Juizado.<br>Sobre embriaguez ao volante, assinale:", a:"Conduzir veículo com capacidade psicomotora alterada por álcool é crime, ainda que não haja dano, bastando a concentração prevista em lei ou a alteração comprovada", b:"Só é crime se houver vítima", c:"Duas cervejas nunca configuram crime", d:"Bafômetro não serve como prova", correta:"A"},
{pergunta:"67. Penal - Mariana foi vítima de furto de seu celular no ônibus.<br>O autor pegou o celular do bolso dela sem ela perceber.<br>Mariana registrou boletim de ocorrência no mesmo dia.<br>A polícia prendeu o autor 2 dias depois com o celular.<br>O autor alega que pegou por engano, achando que era dele.<br>Mariana quer o celular de volta e que ele seja punido.<br>Sobre furto, assinale:", a:"Furto exige violência", b:"Furto exige que a vítima veja", c:"O furto consiste em subtrair coisa alheia móvel para si ou para outrem, sem violência, bastando a inversão da posse", d:"Pegar por engano sempre exclui crime", correta:"C"},
{pergunta:"68. Processo Penal - O Ministério Público ofereceu denúncia contra Paulo por roubo.<br>Paulo foi citado e apresentou resposta à acusação.<br>O juiz recebeu a denúncia e marcou audiência de instrução.<br>Na audiência, foram ouvidas testemunhas e o réu foi interrogado.<br>Paulo alega que não estava no local do crime e tem álibi.<br>O juiz vai proferir sentença após as alegações finais.<br>Sobre o procedimento no processo penal, assinale:", a:"Denúncia pode ser oferecida sem prova mínima", b:"Réu não precisa ser citado", c:"O processo penal deve observar o devido processo legal, contraditório e ampla defesa, com produção de provas e sentença fundamentada", d:"Juiz pode condenar sem provas", correta:"C"},
{pergunta:"69. Processo Civil - Carla entrou com ação de cobrança contra uma empresa.<br>A empresa foi citada e apresentou contestação com documentos.<br>Carla pediu produção de prova testemunhal e pericial.<br>O juiz saneou o processo e marcou audiência de instrução.<br>Na audiência, foram ouvidas testemunhas das duas partes.<br>O juiz vai julgar o caso com base nas provas produzidas.<br>Sobre fase de saneamento e instrução, assinale:", a:"Juiz não pode sanear processo", b:"Prova testemunhal é proibida", c:"Prova pericial nunca é admitida", d:"No saneamento, o juiz resolve questões pendentes, fixa pontos controvertidos e defere provas, buscando a solução do mérito", correta:"D"},
{pergunta:"70. Trabalho - Pedro trabalha como entregador por aplicativo.<br>Ele trabalha 10 horas por dia, todos os dias, sem folga.<br>O aplicativo controla seus horários, rotas e avaliações.<br>Pedro alega que é empregado e quer direitos trabalhistas.<br>A empresa alega que ele é autônomo, pois tem flexibilidade.<br>O caso foi parar na Justiça do Trabalho.<br>Sobre vínculo empregatício, assinale:", a:"O vínculo exige pessoalidade, habitualidade, subordinação e onerosidade, devendo ser analisado o caso concreto, mesmo em trabalho por aplicativo", b:"Entregador nunca é empregado", c:"Aplicativo nunca gera vínculo", d:"Flexibilidade exclui vínculo sempre", correta:"A"},
{pergunta:"71. Empresarial - Uma sociedade limitada tem 3 sócios.<br>Um dos sócios quer sair e vender suas quotas para um estranho.<br>Os outros sócios não concordam com a entrada do estranho.<br>O contrato social diz que a cessão depende de concordância dos sócios.<br>O sócio que quer sair alega que pode vender para quem quiser.<br>Os outros sócios querem exercer direito de preferência.<br>Sobre cessão de quotas em sociedade limitada, assinale:", a:"Sócio pode vender para estranho sem concordância", b:"Cessão de quotas para estranho depende de concordância dos demais sócios, se o contrato exigir, respeitado o direito de preferência", c:"Contrato social não vale", d:"Sócio que sai não precisa avisar", correta:"B"},
{pergunta:"72. Consumidor - Beatriz comprou um tênis pela internet por R$ 500.<br>O tênis chegou com tamanho errado e cor diferente da pedida.<br>Beatriz pediu troca, mas a loja disse que não troca produto em promoção.<br>Beatriz quer devolver e receber o dinheiro de volta.<br>Ela comprou há 5 dias e não usou o tênis.<br>Ela alega direito de arrependimento.<br>Sobre compra fora do estabelecimento, assinale:", a:"Consumidor não tem direito de arrependimento", b:"Promoção não tem troca", c:"O consumidor pode desistir da compra feita fora do estabelecimento, como pela internet, em 7 dias, com devolução do valor", d:"Só pode trocar se houver defeito", correta:"C"},
{pergunta:"73. Tributário - Uma prefeitura cobrou taxa de lixo de todos os moradores.<br>A taxa foi cobrada no mesmo valor para todos, sem considerar o tamanho do imóvel.<br>Um morador questionou, dizendo que a taxa é inconstitucional.<br>Ele alega que a taxa deve ser proporcional ao serviço prestado.<br>A prefeitura alega que pode cobrar taxa de qualquer forma.<br>O caso foi julgado pelo STF.<br>Sobre taxas, assinale:", a:"Taxa pode ser cobrada sem serviço", b:"Taxa é igual a imposto", c:"Taxa pode ser cobrada por qualquer valor", d:"A taxa deve ter base de cálculo própria, vinculada ao serviço público prestado ou ao poder de polícia, não podendo ter base de imposto", correta:"D"},
{pergunta:"74. Administrativo - Um prefeito contratou empresa sem licitação para obra de R$ 2 milhões.<br>Ele alegou urgência, mas não comprovou emergência.<br>O Tribunal de Contas reprovou as contas e aplicou multa.<br>O Ministério Público entrou com ação de improbidade.<br>O prefeito alega que a obra era necessária e foi bem feita.<br>Ele diz que não houve dano ao erário.<br>Sobre licitação e improbidade, assinale:", a:"Prefeito pode contratar sem licitação sempre", b:"Obra bem feita exclui improbidade", c:"A dispensa indevida de licitação pode configurar improbidade administrativa, ainda que não haja dano, se houver dolo e violação aos princípios", d:"Tribunal de Contas não pode multar prefeito", correta:"C"},
{pergunta:"75. Ambiental - Um empresário desmatou área de preservação permanente para criar gado.<br>O IBAMA autuou e aplicou multa de R$ 100 mil.<br>O empresário alega que a terra é dele e ele pode fazer o que quiser.<br>Ele diz que não sabia que era área de preservação.<br>O Ministério Público pediu recuperação da área degradada.<br>O caso envolve responsabilidade ambiental.<br>Sobre área de preservação, assinale:", a:"Proprietário pode desmatar sua terra", b:"Desconhecimento exclui responsabilidade", c:"Multa do IBAMA é suficiente, não precisa recuperar", d:"O desmatamento em APP gera dever de reparar e recuperar a área, com responsabilidade objetiva, independente de culpa", correta:"D"},
{pergunta:"76. Civil - Ana emprestou seu carro para seu irmão João.<br>João bateu o carro em um poste e destruiu o veículo.<br>Ana quer que João pague o conserto, mas João diz que foi acidente.<br>Ele alega que não teve culpa, pois o poste estava no caminho.<br>Ana diz que ele pegou o carro emprestado e tem que devolver em bom estado.<br>O caso foi parar na Justiça.<br>Sobre comodato, assinale:", a:"Quem pega emprestado não precisa devolver", b:"Acidente exclui responsabilidade", c:"No comodato, o comodatário deve conservar e devolver a coisa como recebeu, respondendo por perdas e danos se houver culpa ou uso indevido", d:"Comodato é igual a doação", correta:"C"},
{pergunta:"77. Constitucional - Um Estado editou lei aumentando o salário dos deputados estaduais.<br>A lei foi aprovada em votação secreta, sem publicidade.<br>Um cidadão entrou com ação popular pedindo anulação.<br>Ele alega violação aos princípios da publicidade e moralidade.<br>O Estado alega que pode aumentar salário como quiser.<br>O caso foi julgado pelo Tribunal.<br>Sobre princípios da Administração, assinale:", a:"Administração pode agir sem publicidade", b:"Aumento de salário não precisa de lei", c:"A Administração deve obedecer aos princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência", d:"Princípios não são obrigatórios", correta:"C"},
{pergunta:"78. Penal - Carlos foi condenado a 4 anos de prisão por furto.<br>Ele cumpriu 1 ano e teve bom comportamento na prisão.<br>Ele pediu progressão para o regime semiaberto.<br>O juiz negou, dizendo que ele não tem direito.<br>Carlos alega que cumpriu o requisito objetivo e subjetivo.<br>Ele recorreu da decisão.<br>Sobre progressão de regime, assinale:", a:"Progressão nunca é permitida", b:"Bom comportamento não importa", c:"Progressão exige apenas tempo", d:"A progressão de regime exige cumprimento de fração da pena e bom comportamento, com exame do mérito e requisitos legais", correta:"D"},
{pergunta:"79. Processo Penal - A polícia fez busca na casa de José sem mandado.<br>Os policiais entraram à noite, sem autorização, e apreenderam drogas.<br>José alega que a prova é ilícita, pois a casa é inviolável.<br>O Ministério Público diz que a prova é válida, pois encontrou drogas.<br>O juiz vai decidir sobre a validade da prova.<br>O caso discute inviolabilidade do domicílio.<br>Sobre busca domiciliar, assinale:", a:"Polícia pode entrar em casa a qualquer hora", b:"Casa não é inviolável", c:"Encontrar droga torna a busca legal", d:"A casa é asilo inviolável, só podendo nela entrar com consentimento, flagrante, desastre ou mandado judicial durante o dia, sob pena de ilicitude da prova", correta:"D"},
{pergunta:"80. Ética - Um advogado foi condenado por apropriação de valores de cliente.<br>Ele recebeu R$ 30 mil de acordo e não repassou ao cliente.<br>O cliente denunciou à OAB e o advogado foi excluído dos quadros.<br>Depois de 5 anos, ele quer voltar a advogar e pede reabilitação.<br>Ele alega que já pagou o cliente e tem bom comportamento.<br>A OAB vai analisar o pedido.<br>Sobre exclusão e reabilitação, assinale:", a:"Excluído nunca pode voltar", b:"Exclusão é pena leve", c:"Reabilitação é automática após 1 ano", d:"A reabilitação depende de bom comportamento e, no caso de exclusão por apropriação, de prova de ressarcimento e reabilitação criminal, a critério do Conselho", correta:"A"},
];
let atual=0, acertos=0, tempo=5*60*60, intervalo, jaRespondeu=false;
function iniciar41(){ document.getElementById('tela-inicio').style.display='none'; document.getElementById('tela-questao').style.display='block'; atual=0; acertos=0; tempo=5*60*60; clearInterval(intervalo); intervalo=setInterval(()=>{ tempo--; let h=Math.floor(tempo/3600), m=Math.floor((tempo%3600)/60), s=tempo%60; document.getElementById('timer').innerText=`⏰ ${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(tempo<=0){ clearInterval(intervalo); finalizar41(); } },1000); mostrar(); }
function mostrar(){ jaRespondeu=false; tempoQ=0; let q=questoes41[atual]; document.getElementById('feedback').style.display='none'; document.getElementById('btnProxima').innerText="PRÓXIMA ➡️"; document.getElementById('progresso').innerText=`Questão ${atual+1} de 80 | Acertos: ${acertos}`; document.getElementById('questao').innerHTML=`<p><b>${q.pergunta}</b></p><label><input type="radio" name="resp" value="A"> A) ${q.a}</label><label><input type="radio" name="resp" value="B"> B) ${q.b}</label><label><input type="radio" name="resp" value="C"> C) ${q.c}</label><label><input type="radio" name="resp" value="D"> D) ${q.d}</label>`; }
function proxima41(){ if(!jaRespondeu){ let sel=document.querySelector('input[name="resp"]:checked'); if(!sel){ alert("Marca uma alternativa!"); return; } let q=questoes41[atual]; let fb=document.getElementById('feedback'); fb.style.display='block'; if(sel.value===q.correta){ acertos++; fb.style.background="#d4edda"; fb.innerText="✅ ACERTOU! Boa! Continua!"; } else{ fb.style.background="#f8d7da"; fb.innerText=`❌ ERROU! Você marcou ${sel.value}, a certa é ${q.correta}.`; } document.getElementById('progresso').innerText=`Questão ${atual+1} de 80 | Acertos: ${acertos}`; document.getElementById('btnProxima').innerText="CONTINUAR ➡️"; jaRespondeu=true; return; } else { atual++; if(atual<80) mostrar(); else finalizar41(); } }
function pular41(){ atual++; if(atual<80) mostrar(); else finalizar41(); }
function irPara(){ let n=parseInt(document.getElementById('pularPara').value); if(!n||n<1||n>80){ alert("Digita de 1 a 80"); return; } atual=n-1; mostrar(); }
function finalizar41(){ clearInterval(intervalo); document.getElementById('tela-questao').style.display='none'; document.getElementById('tela-fim').style.display='block'; let passou=acertos>=40?"APROVADO ✅":"REPROVADO ❌"; document.getElementById('resultado').innerText=`${passou} - ${acertos}/80`; document.getElementById('detalhe').innerText=`Você precisava de 40 acertos.`; }
</script>
