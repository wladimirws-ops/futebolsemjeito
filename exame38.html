<script>
const Q=[
["Paulo, advogado inscrito na OAB/SP, foi contratado por Fernanda para propor ação de cobrança. No contrato, Paulo combinou que só receberia se Fernanda vencesse, em percentual sobre o que ela ganhasse. Fernanda perdeu em 1ª instância e Paulo quer cobrar mesmo assim. Sobre a quota litis, assinale a correta:",["É vedada em qualquer hipótese, pois o advogado deve receber por hora","É permitida, desde que o percentual não seja abusivo e observadas as regras do Estatuto e do Código de Ética","Só é permitida se for de 50% do valor","É proibida para ação de cobrança"],1],
["Mariana, advogada, divulgou em seu Instagram foto de um cliente com a legenda 'mais um caso ganho, contrate quem ganha'. A cliente não autorizou. Sobre a publicidade, é correto:",["É permitida, pois é marketing pessoal","É vedada a ostentação, captação de clientela e divulgação sem autorização, devendo ser sóbria","É permitida se ela apagar depois","É permitida se for em rede social"],1],
["Carlos, estagiário de Direito do 7º período, inscrito na OAB como estagiário, assinou sozinho uma petição inicial e foi despachar com o juiz. Sobre a atuação do estagiário:",["Pode atuar sozinho em qualquer ato","Só pode praticar atos em conjunto com o advogado e sob sua responsabilidade e supervisão","Pode assinar petição, mas não despachar","Pode atuar sozinho se o advogado autorizar por WhatsApp"],1],
["João, advogado, renunciou ao mandato no meio do processo, sem avisar seu cliente Pedro, que perdeu o prazo. Sobre a renúncia, é correto:",["Pode renunciar sem avisar","Deve notificar o cliente e continuar a representá-lo por 10 dias, salvo acordo em contrário","Não pode renunciar nunca","A renúncia tem efeito imediato e o cliente que se vire"],1],
["Beatriz, advogada, soube por seu cliente de um segredo que pode prejudicá-lo. Um jornalista oferece dinheiro para ela revelar. Sobre o sigilo profissional:",["Pode revelar se o valor for alto","É dever do advogado guardar sigilo, salvo grave ameaça ao direito à vida e à honra ou quando ele próprio for acusado","Pode revelar se o cliente for culpado","Não há sigilo para advogado"],1],
["Município de Alfa quer construir uma creche e precisa de um terreno de José, que não quer vender. O prefeito decreta desapropriação por utilidade pública. Sobre a desapropriação, é correto:",["Pode tomar sem pagar","Exige prévia e justa indenização em dinheiro, por necessidade, utilidade pública ou interesse social","Pode pagar em 10 anos","Pode tomar sem processo"],1],
["A Prefeitura de Beta multou a lanchonete de Ana por falta de higiene, sem dar a ela chance de se defender. Ana procura advogado. Sobre o ato administrativo, é correto:",["É válido, pois a Prefeitura pode tudo","É inválido se não observar contraditório, ampla defesa, motivo e finalidade, podendo ser anulado","É válido porque é ato de polícia","Não pode ser questionado"],1],
["O Estado Alfa abriu concurso para professor, com edital prevendo 10 vagas. Após a prova, nomeou apenas quem ele quis, sem seguir a ordem de classificação. Sobre o concurso, é correto:",["Pode nomear quem quiser","Deve observar isonomia, edital e ordem de classificação, pois o edital vincula a Administração","Não precisa de edital","Pode nomear por indicação política"],1],
["Empresa Alfa venceu licitação para construir ponte, mas a Administração mudou unilateralmente o projeto, aumentando o serviço. Sobre o contrato administrativo, é correto:",["Não pode mudar","A Administração pode alterar unilateralmente, com as cláusulas exorbitantes, mantido o equilíbrio econômico-financeiro","O contrato é igual ao privado","A empresa deve aceitar sem receber nada a mais"],1],
["João da Silva foi atropelado por ônibus de empresa concessionária de serviço público, que furou o sinal. João quer indenização. Sobre a responsabilidade, é correto:",["Deve provar culpa do motorista","É objetiva, art. 37 §6º CF, bastando conduta, dano e nexo, admitida excludente","Só o Estado responde, nunca a empresa","Não há indenização para atropelamento"],1],
["Maria, servidora pública, completou 3 anos de efetivo exercício e foi aprovada no estágio probatório. Ela falta muito e quer saber se pode ser demitida. Sobre estabilidade:",["Não pode ser demitida nunca","Adquiriu estabilidade, mas pode perder o cargo por sentença, processo administrativo ou avaliação periódica, na forma da lei","Só após 5 anos tem estabilidade","Estabilidade é vitaliciedade"],1],
["Fiscal da Prefeitura interditou a padaria de Pedro por vender pão vencido, sem lei que previsse a interdição. Sobre o poder de polícia, é correto:",["É ilimitado","É limitado pela lei, proporcionalidade e direitos fundamentais, exigindo base legal","Só Município tem","Não pode ser questionado na Justiça"],1],
["O Congresso aprovou emenda querendo acabar com o voto direto e secreto. Um deputado procura você. Sobre emenda constitucional, é correto:",["Pode acabar com o voto","Não pode abolir cláusulas pétreas: forma federativa, voto direto, secreto, universal e periódico, separação dos Poderes e direitos e garantias individuais","Pode, se tiver 3/5 dos votos","Pode, se o Presidente quiser"],1],
["Ana, jornalista, publicou reportagem criticando prefeito. O prefeito mandou prender Ana por crime de opinião. Sobre liberdade de expressão, é correto:",["Não existe liberdade de expressão","É garantida, vedado o anonimato, mas não é absoluta, podendo responder por abuso","Pode ser presa por criticar","Só jornalista tem liberdade"],1],
["Policial entrou à noite na casa de João, sem ordem judicial e sem flagrante, para procurar droga. Sobre a casa, art. 5º XI CF:",["Pode entrar a qualquer hora","É asilo inviolável, ninguém pode penetrar sem consentimento, salvo flagrante, desastre, socorro ou ordem judicial durante o dia","Pode entrar à noite sem ordem","Não tem proteção"],1],
["José foi preso em flagrante furtando celular. Um popular segurou José até a polícia chegar. Sobre prisão em flagrante, é correto:",["Só polícia pode prender","Qualquer do povo pode prender quem for encontrado em flagrante delito","Só juiz pode prender","Popular não pode prender"],1],
["Cidadão Roberto soube que a Prefeitura vai pagar R$ 2 milhões por uma praça que custa R$ 200 mil. Quer entrar na Justiça. Sobre ação popular, é correto:",["Só político pode propor","Qualquer cidadão pode propor, para anular ato lesivo ao patrimônio público, à moralidade, ao meio ambiente","Exige pagar custas caras","Só para brasileiro nato"],1],
["Maria quer saber informações sobre ela que estão em banco de dados do INSS, mas o INSS negou. Sobre habeas data, é correto:",["Cabe para proteger liberdade","Cabe para assegurar conhecimento de informações relativas ao impetrante em bancos de dados públicos","Cabe para anular ato","Não existe"],1],
["Pedro teve seu pedido de aposentadoria negado, mas tem direito líquido e certo, provado por documento. Sobre mandado de segurança, é correto:",["Cabe contra lei em tese","Exige direito líquido e certo, não amparado por habeas corpus ou habeas data, com prazo de 120 dias","Pode ser impetrado a qualquer tempo","Não cabe contra autoridade"],1],
["O Supremo foi provocado para julgar se uma lei estadual é inconstitucional. Sobre o controle concentrado, é correto:",["Qualquer pessoa pode propor ADI","Só legitimados do art. 103 CF podem propor ADI, para controle concentrado no STF","Só juiz pode","Não existe controle concentrado"],1],
["João vendeu seu apartamento para Maria, com contrato particular, mas não registrou no cartório. Depois vendeu para Ana, que registrou. Quem é dona?",["Maria, pois comprou primeiro","Ana, pois a propriedade se transfere pelo registro do título translativo","João ainda é dono","Nenhuma"],1],
["Carlos e Fernanda são casados em comunhão parcial. Carlos comprou um carro durante o casamento com seu salário. Na separação, o carro é:",["Só de Carlos","Comum, pois adquirido na constância do casamento, em regra","Só de Fernanda","De ninguém"],1],
["Rodrigo e Camila se divorciaram e brigam pela guarda do filho Lucas, de 6 anos. Ambos querem a guarda. Sobre guarda, é correto:",["Só mãe tem direito","A compartilhada é regra, mesmo com divergência, salvo se um genitor declarar que não a deseja","Só pai tem direito","Juiz deve dar para avó"],1],
["Antônio morreu deixando filho reconhecido fora do casamento e filho do casamento. Sobre filiação, é correto:",["Filho fora do casamento não herda","Todos os filhos são iguais, vedada qualquer discriminação, com os mesmos direitos","Só filho do casamento herda","Filho adotivo não herda"],1],
["Paulo morreu sem testamento, deixando filho e pai vivo. Quem herda primeiro?",["Pai","Filho, pois descendente prefere ascendente na ordem de vocação","Cônjuge","Colateral"],1],
["Joana quer fazer testamento deixando tudo para sua amiga. Ela tem um filho. Sobre testamento, é correto:",["Pode deixar tudo para amiga","Pode dispor de apenas 50%, pois a outra metade é legítima dos herdeiros necessários","Não pode fazer testamento","Só pode deixar para filho"],1],
["Pedro mora há 16 anos em terreno, sem oposição, sem título, cuidando como dono. Sobre usucapião extraordinária:",["Exige 5 anos e título","Exige 15 anos de posse ininterrupta, sem oposição, independente de título e boa-fé","Exige 2 anos","Só para imóvel rural"],1],
["Empresa Alfa vendeu geladeira com defeito para Maria, que reclamou em 10 dias. A loja disse que não troca. Sobre negócio jurídico e vício, é correto:",["Maria não tem direito","Fornecedor responde solidariamente, com 30 dias para sanar o vício, sob pena de troca, devolução ou abatimento","Só fabricante responde","Maria deve ficar com defeito"],1],
["Lucas assinou contrato com 15 anos, sem representante, para comprar moto de R$ 20 mil. Sobre negócio jurídico, é correto:",["É válido","É nulo ou anulável, pois exige agente capaz, objeto lícito e forma legal","É válido se ele quiser","Não precisa de capacidade"],1],
["Fernanda emprestou seu celular para Ana, que não devolveu e vendeu. Sobre posse, é correto:",["Fernanda perdeu a posse","Posse é exercício de fato de poder inerente à propriedade, podendo ser defendida por interditos","Não tem proteção","Só dono tem posse"],1],
["Túlio entrou na loja, pegou um relógio sem pagar e saiu correndo, sem violência. Sobre o crime, é:",["Roubo","Furto, subtrair coisa alheia móvel para si, sem violência","Não é crime","É estelionato"],1],
["Alfredo, com faca, exigiu que a caixa do banco entregasse o dinheiro, ameaçando matá-la. Sobre o crime, é:",["Furto","Roubo, subtrair mediante grave ameaça ou violência","Não é crime porque não levou","É furto qualificado"],1],
["João, com raiva, deu 5 facadas em Pedro, que morreu. João queria matar. Sobre homicídio, é:",["Culposo","Doloso, pois quis o resultado, podendo ser qualificado","Não é crime","É lesão corporal"],1],
["Carlos estava em casa quando um ladrão entrou armado. Carlos pegou uma faca e se defendeu, matando o ladrão. Sobre legítima defesa, é correto:",["É vingança","Exige agressão injusta, atual ou iminente, uso moderado de meios necessários, podendo excluir ilicitude","Não existe","Permite excesso sempre"],1],
["Maria estava se afogando e Pedro, para salvá-la, quebrou a porta da casa de João para pegar boia. Sobre estado de necessidade, é correto:",["É crime","Pode excluir ilicitude, pois salvou direito de perigo atual, que não provocou","Só para patrimônio","Não existe"],1],
["João tentou matar Pedro, deu 2 tiros, mas Pedro sobreviveu porque foi socorrido. Sobre tentativa, é:",["Não é punida","É punida com pena do crime consumado diminuída de 1/3 a 2/3","É punida igual ao consumado","Não existe tentativa"],1],
["Túlio e Alfredo combinaram assaltar joalheria. Alfredo entrou com arma, Túlio ficou vigiando na porta. Sobre concurso de pessoas, é correto:",["Só Alfredo responde","Ambos respondem, pois houve unidade de desígnios e divisão de tarefas, na medida de sua culpabilidade","Só Túlio responde","Nenhum responde"],1],
["Crime de 2010, pena de 4 anos, sem causa interruptiva. Em 2023, ainda pode punir? Sobre prescrição penal, é correto:",["Pode punir sempre","Extingue a punibilidade pelo decurso do tempo, conforme prazo do art. 109 CP","Só para crime leve","Não pode ser reconhecida de ofício"],1],
["Delegado instaurou inquérito para apurar furto, ouvindo testemunhas sem presença do advogado do suspeito. Sobre inquérito policial, é correto:",["É processo judicial","É procedimento administrativo, inquisitorial, sigiloso, sem contraditório pleno","É público para todos","Não pode ser arquivado"],1],
["Polícia gravou conversa de João sem autorização judicial e quer usar no processo. Sobre prova ilícita, é correto:",["É admitida","É inadmissível, deve ser desentranhada, salvo se for a única prova","Pode ser usada","Só para defesa"],1],
["João matou Pedro com faca, com intenção de matar. Quem julga? Sobre Júri, é correto:",["Juiz sozinho","Tribunal do Júri, pois julga crimes dolosos contra a vida, com soberania dos veredictos","Juizado","Turma recursal"],1],
["Maria trabalha em banco, 8h por dia, de segunda a sexta, 44h semanais, sem hora extra. Sobre jornada, CLT, é correto:",["É ilegal","É a jornada normal prevista na CLT e CF, 8h diárias e 44h semanais","Deveria ser 6h","Não há limite"],1],
["Pedro foi contratado verbalmente para trabalhar na padaria, sem carteira assinada. Sobre contrato de trabalho, é correto:",["É nulo","Pode ser verbal ou escrito, por prazo determinado ou indeterminado, valendo mesmo sem registro","Não pode ser verbal","Exige cartório"],1],
["Ana trabalhou o ano todo em 2023 na empresa. Em dezembro, quer saber do 13º. Sobre 13º salário, é correto:",["Não existe","É gratificação natalina, 1/12 por mês trabalhado, paga em 2 parcelas","Só para servidor","Só quem tem 1 ano"],1],
["Carlos completou 12 meses na empresa e quer férias. Sobre férias, é correto:",["Tem 15 dias","Tem 30 dias, com acréscimo de 1/3 constitucional, após 12 meses","Não tem férias","Só para doméstico"],1],
["Empresa Alfa não deposita FGTS de João há 6 meses. Sobre FGTS, é correto:",["É pago pelo empregado","Empregador deve depositar 8% sobre a remuneração, sendo obrigação dele","É opcional","Só para servidor"],1],
["Maria foi demitida sem justa causa após 5 anos. Sobre aviso prévio, é correto:",["Não tem aviso","Tem aviso prévio proporcional, mínimo de 30 dias, com acréscimo por ano trabalhado","É fixo em 90 dias","Não existe mais"],1],
["João, empregado, quer processar a empresa por horas extras não pagas. Onde ele deve entrar? Sobre Justiça do Trabalho, é correto:",["Justiça Federal","Justiça do Trabalho, que julga ações oriundas da relação de trabalho","Justiça Estadual","Juizado"],1],
["Advogado de Pedro perdeu prazo de 8 dias para recurso ordinário trabalhista. Sobre prazo, é correto:",["Prazo é 5 dias","Prazo é 8 dias para recurso ordinário na Justiça do Trabalho","Prazo é 15 dias","Prazo é 30 dias"],1],
["Ana quer propor ação de cobrança de R$ 10 mil, mas não sabe o que colocar na petição. Sobre petição inicial, CPC, deve conter:",["Só nome do autor","Juízo, partes, fato, fundamento, pedido, valor da causa, provas e opção por audiência","Só pedido","Só endereço do réu"],1],
["Pedro foi citado para responder ação, mas não apresentou defesa. Sobre citação e revelia, é correto:",["Citação não é necessária","Citação é ato que convoca réu para integrar o processo, e a falta de defesa pode gerar revelia","Só por edital","Não pode ser eletrônica"],1],
["Juiz deu sentença sem fundamentar, só dizendo 'julgo procedente'. Sobre sentença, é correto:",["É válida","Deve ser fundamentada, sob pena de nulidade, com relatório, fundamentação e dispositivo","Pode ser oral sem registro","Não precisa de relatório"],1],
["Maria ganhou ação, transitou em julgado, e João quer discutir de novo o mesmo assunto. Sobre coisa julgada, é correto:",["Pode discutir sempre","Torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso","Só para penal","Não existe no civil"],1],
["Ana está sendo despejada e precisa de liminar urgente para não perder a casa. Sobre tutela de urgência, é correto:",["Só após sentença","Pode ser concedida liminarmente, com probabilidade do direito e perigo de dano","Não existe","Só para réu"],1],
["Pedro quer recorrer de decisão interlocutória que negou prova. Sobre agravo de instrumento, prazo é:",["5 dias","15 dias","8 dias","30 dias"],1],
["Maria perdeu ação e quer recorrer da sentença. Sobre apelação, é correto:",["Não tem efeito","Tem efeito devolutivo e suspensivo, em regra, devolvendo ao tribunal","Só devolutivo","Não cabe contra sentença"],1],
["João tem título executivo extrajudicial, um cheque, e quer cobrar. Sobre execução, é correto:",["Só título judicial","Pode ser para título judicial ou extrajudicial, com penhora e defesa por embargos","Não há penhora","Não há defesa"],1],
["Empresa Alfa faliu, devendo para bancos, empregados e fornecedores. Sobre falência, é correto:",["Só pessoa física","É processo de execução coletiva do empresário devedor, com administrador judicial","Não tem administrador","Não abrange crédito trabalhista"],1],
["Empresa Beta está em crise, mas quer continuar funcionando e pagar credores com plano. Sobre recuperação judicial, é correto:",["Só para falido","Permite superar crise, com plano aprovado, suspendendo execuções","Não tem juiz","Não suspende execução"],1],
["João recebeu cheque de Maria, foi ao banco e não tinha fundo. Sobre cheque, é correto:",["É promessa de pagamento","É ordem de pagamento à vista, podendo ser endossado e protestado","Não pode ser endossado","Prescreve em 1 dia"],1],
["Loja Alfa vendeu para Pedro a prazo, emitindo duplicata. Pedro não pagou. Sobre duplicata, é correto:",["Não é título","É título causal, oriundo de compra e venda mercantil ou prestação de serviços, podendo ser protestada","Não pode ser protestada","Só para pessoa física"],1],
["Maria comprou celular pela internet, chegou com defeito, e a loja não troca. Sobre CDC, consumidor é:",["Só quem compra na loja","Quem adquire ou utiliza produto ou serviço como destinatário final","Só pessoa física","Só rico"],1],
["Pedro comprou geladeira que estragou em 10 dias. Loja disse que não troca. Sobre vício do produto, CDC, é correto:",["Fornecedor não responde","Fornecedor responde solidariamente, com 30 dias para sanar, sob pena de troca, devolução ou abatimento","Só fabricante responde","Consumidor deve ficar com defeito"],1],
["Ana comprou curso pela internet, se arrependeu em 3 dias. Sobre arrependimento, CDC, é correto:",["Não existe","Em 7 dias, para contratação fora do estabelecimento comercial, com devolução","Em 30 dias para qualquer compra","Só para compra acima de R$ 1.000"],1],
["Menino Lucas, de 10 anos, furtou bicicleta. Sobre ECA, criança é:",["Até 18 anos","Até 12 anos incompletos, e adolescente de 12 a 18","Até 21","Até 16"],1],
["Adolescente de 15 anos roubou celular. Sobre ato infracional, é correto:",["Pode ser preso como adulto","Adolescente pode cumprir medida socioeducativa, inclusive internação, com garantias","Não há medida","Só advertência"],1],
["Senhor José, 65 anos, foi desrespeitado na fila do banco. Sobre Estatuto do Idoso, idoso é:",["Acima de 50","Pessoa com 60 anos ou mais, com prioridade e proteção","Acima de 70","Só aposentado"],1],
["Maria apanhou do marido em casa e quer medida protetiva. Sobre Lei Maria da Penha, é correto:",["Só para casada","Protege mulher em situação de violência doméstica e familiar, com medidas protetivas","Não prevê medida protetiva","Só para violência física"],1],
["Fábrica Alfa jogou lixo no rio, matando peixes. Sobre meio ambiente, art. 225 CF, é correto:",["Não é direito","Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum, com dever de preservar e reparar","Só Poder Público deve preservar","Não há dever de reparar"],1],
["Governo quer tabelar preço e acabar com livre iniciativa. Sobre ordem econômica, art. 170 CF, é fundada em:",["Só lucro","Valorização do trabalho humano e livre iniciativa, com função social da propriedade, livre concorrência, defesa do consumidor","Só Estado","Só propriedade privada"],1],
["Fisco lançou IPTU de João sem verificar o fato gerador. Sobre lançamento tributário, é correto:",["É facultativo","É procedimento administrativo que verifica ocorrência do fato gerador, determina matéria tributável, calcula montante e identifica sujeito passivo","Só para IPTU","Não pode ser revisto"],1],
["Templo religioso foi cobrado IPTU. Sobre imunidade tributária, é correto:",["É isenção","É limitação constitucional ao poder de tributar, como para templos, não podendo ser cobrada","Pode ser criada por lei ordinária","Não existe para templos"],1],
["Loja Alfa vendeu mercadoria para cliente em outro Estado. Sobre ICMS, é correto:",["É municipal","É estadual, sobre circulação de mercadorias e serviços, com não-cumulatividade","É federal","Só sobre importação"],1],
["Empresa Beta prestou serviço de consultoria. Sobre ISS, é correto:",["É estadual","É municipal, sobre serviços de qualquer natureza, definidos em lei complementar","É federal","Não incide sobre serviço"],1],
["João recebeu salário de R$ 10 mil e não pagou IR. Sobre IR, é correto:",["É estadual","É federal, sobre renda e proventos de qualquer natureza, com progressividade","É municipal","Não incide sobre salário"],1],
["Maria herdou casa da mãe e foi cobrada ITCMD. Sobre ITCMD, é correto:",["É federal","É estadual, sobre transmissão causa mortis e doação, de quaisquer bens","É municipal","Não incide sobre doação"],1],
["Pedro é dono de apartamento na cidade. Sobre IPTU, é correto:",["É estadual","É municipal, sobre propriedade predial e territorial urbana","É federal","Só para imóvel rural"],1],
["Carlos tem carro e foi cobrado IPVA. Sobre IPVA, é correto:",["É municipal","É estadual, sobre propriedade de veículos automotores","É federal","Não existe"],1],

];
let atual=0, acertos=0, respondidas=new Set();
function mostrar(){
document.getElementById('qnum').innerText=`Questão ${atual+1} de ${Q.length}`;
document.getElementById('pergunta').innerText=Q[atual][0];
document.getElementById('prog').style.width=((atual+1)/Q.length*100)+'%';
const div=document.getElementById('opcoes'); div.innerHTML='';
Q[atual][1].forEach((alt,i)=>{
const d=document.createElement('div'); d.className='opcao'; d.innerText=String.fromCharCode(65+i)+") "+alt;
d.onclick=()=>{ if(d.dataset.ok) return; d.dataset.ok=1;
if(i===Q[atual][2]){ d.classList.add('certa'); if(!respondidas.has(atual)){acertos++; respondidas.add(atual);} }
else{ d.classList.add('errada'); div.children[Q[atual][2]].classList.add('certa'); respondidas.add(atual); }
document.getElementById('acertos').innerText=`Acertos: ${acertos}`;
if(respondidas.size===Q.length) document.getElementById('final').innerText=`Fim! Você acertou ${acertos} de ${Q.length} 🎉`;
};
div.appendChild(d);
});
}
function proxima(){ if(atual<Q.length-1){atual++; mostrar();} }
function anterior(){ if(atual>0){atual--; mostrar();} }
function irPara(){ let v=parseInt(document.getElementById('irInput').value); if(v>=1 && v<=Q.length){atual=v-1; mostrar();} }
mostrar();
</script>
