let atual=0, acertos=0, respondidas=new Set();
function mostrar(){
document.getElementById('qnum').innerText=`Questão ${atual+1} de ${Q.length}`;
document.getElementById('pergunta').innerText=Q[atual][0];
document.getElementById('prog').style.width=((atual+1)/Q.length*100)+'%';
const div=document.getElementById('opcoes'); div.innerHTML='';
Q[atual][1].forEach((alt,i)=>{
const d=document.createElement('div'); d.className='opcao'; d.innerText=String.fromCharCode(65+i)+") "+alt;
d.onclick=()=>{ if(d.dataset.ok) return; d.dataset.ok=1;
if(i===Q[atual][2]){ d.classList.add('certa'); if(!respondidas.has(atual)){acertos++; respondidas.add(atual);} }
else{ d.classList.add('errada'); div.children[Q[atual][2]].classList.add('certa'); respondidas.add(atual); }
document.getElementById('acertos').innerText=`Acertos: ${acertos}`;
if(respondidas.size===Q.length) document.getElementById('final').innerText=`Fim! Você acertou ${acertos} de ${Q.length} 🎉`;
};
div.appendChild(d);
});
}
function proxima(){ if(atual<Q.length-1){atual++; mostrar();} }
function anterior(){ if(atual>0){atual--; mostrar();} }
function irPara(){ let v=parseInt(document.getElementById('irInput').value); if(v>=1 && v<=Q.length){atual=v-1; mostrar();} }
mostrar();
</script>
