<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAME 36 - MORTAL GOL OAB</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;max-width:700px;margin:auto}
h1{color:#22ff88;text-align:center}
.topo{text-align:center;color:#ccc}
.card{background:#1a1a1a;border:1px solid #333;padding:15px;border-radius:12px;margin:15px 0}
button{display:block;width:100%;text-align:left;background:#222;color:#fff;border:1px solid #444;padding:12px;margin:6px 0;border-radius:8px;cursor:pointer}
button:hover{background:#333}
.certa{background:#14532d!important;border-color:#22ff88!important}
.errada{background:#7f1d1d!important}
#resultado{text-align:center;font-size:22px;font-weight:bold;margin:20px;color:#22ff88}
.btn-final{background:#22ff88;color:#000;font-weight:bold;text-align:center;padding:15px;border-radius:10px;text-decoration:none;display:block;margin-top:20px}
</style>
</head>
<body>
<h1>⚽ MORTAL GOL OAB</h1>
<p class="topo"><b>EXAME 36</b> - Simulado Estilo FGV<br>10 Questões - Treino Rápido</p>
<div id="quiz"></div>
<div id="resultado"></div>
<a class="btn-final" href="index.html">⬅ VOLTAR PARA O MENU</a>

<script>
const questoes=[
{q:"1. Sobre os direitos fundamentais, é correto afirmar que:",o:["São absolutos e ilimitados","Podem sofrer limitações em caso de colisão com outros direitos","Só valem para brasileiros natos","Não se aplicam às relações privadas"],c:1},
{q:"2. No Direito Penal, o princípio da legalidade significa que:",o:["O juiz pode criar crimes por analogia","Não há crime sem lei anterior que o defina","A pena pode ser aplicada retroativamente sempre","O costume pode criar crime"],c:1},
{q:"3. Sobre o contrato de compra e venda no Código Civil, é correto:",o:["É sempre gratuito","Exige sempre escritura pública","É bilateral e oneroso, em regra","Não gera obrigação para as partes"],c:2},
{q:"4. No processo civil, a petição inicial deve indicar, entre outros:",o:["Apenas o nome do autor","O juízo, as partes, o pedido e o valor da causa","Apenas a sentença que se espera","Somente o endereço do réu"],c:1},
{q:"5. Sobre o habeas corpus, é correto afirmar:",o:["Serve para proteger direito de locomoção","Serve para discutir dívida de aluguel","Só pode ser impetrado por advogado","Não é cabível contra ato de autoridade"],c:0},
{q:"6. No Direito do Trabalho, a jornada normal é de:",o:["6 horas diárias e 36 semanais","8 horas diárias e 44 semanais","10 horas diárias e 50 semanais","12 horas diárias sem limite"],c:1},
{q:"7. Sobre o Direito Administrativo, o ato administrativo possui como atributos:",o:["Presunção de legitimidade, imperatividade e autoexecutoriedade","Apenas a moralidade","Somente a publicidade","Não possui nenhum atributo"],c:0},
{q:"8. No Direito Constitucional, a CF/88 estabelece que a República Federativa do Brasil tem como fundamento:",o:["A livre iniciativa e a pluralidade política","A soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e pluralismo político","Apenas a soberania","Somente o voto indireto"],c:1},
{q:"9. Sobre a responsabilidade civil, é necessário em regra:",o:["Apenas a conduta","Conduta, dano, nexo causal e culpa/dolo","Somente o dano","Apenas a intenção"],c:1},
{q:"10. O recurso cabível contra sentença no processo civil é:",o:["Habeas Corpus","Apelação","Mandado de Segurança","Recurso Especial apenas"],c:1},
];
let acertos=0, respondidas=0;
const div=document.getElementById('quiz');
questoes.forEach((questao,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<b>${questao.q}</b>`;
  questao.o.forEach((alt,j)=>{
    const b=document.createElement('button'); b.innerText=String.fromCharCode(65+j)+") "+alt;
    b.onclick=()=>{
      if(card.dataset.ok) return; card.dataset.ok=1;
      respondidas++;
      if(j===questao.c){ b.classList.add('certa'); acertos++; }
      else{ b.classList.add('errada'); card.children[questao.c+1].classList.add('certa'); }
      if(respondidas===questoes.length) document.getElementById('resultado').innerText=`Você acertou ${acertos} de ${questoes.length} - ${acertos>=7?'APROVADO! 🎉':'Continue treinando! 💪'}`;
    };
    card.appendChild(b);
  });
  div.appendChild(card);
});
</script>
</body>
</html>
