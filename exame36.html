<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exame 36 - Simulado OAB</title>
<style>
*{box-sizing:border-box} body{background:#f1f5f9;font-family:Arial;margin:0;padding:15px}
.box{max-width:750px;margin:auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0001}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#1e3a5f}
h2{text-align:center;color:#1e3a5f;margin:10px 0}
.busca{display:flex;gap:8px;margin:10px 0}
.busca input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px}
.busca button{background:#1e3a5f;color:#fff;border:none;padding:0 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:#22c55e;width:0%}
.qnum{font-weight:bold;margin:12px 0}
.pergunta{background:#eef6ff;border-left:5px solid #1e3a5f;padding:16px;border-radius:8px;line-height:1.6}
.opcao{border:1px solid #ddd;padding:14px;border-radius:10px;margin:10px 0;cursor:pointer;background:#fff}
.opcao:hover{background:#f8fafc}
.certa{background:#dcfce7!important;border-color:#22c55e!important}
.errada{background:#fee2e2!important;border-color:#ef4444!important}
.nav{display:flex;justify-content:space-between;margin-top:15px}
.nav button{background:#1e3a5f;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer}
.final{text-align:center;font-size:20px;font-weight:bold;color:#1e3a5f;margin-top:15px}
.voltar{display:block;text-align:center;margin-top:15px;color:#1e3a5f}
</style>
</head>
<body>
<div class="box">
<div class="top"><span>Exame 36 - Simulado OAB</span><span id="acertos">Acertos: 0</span></div>
<h2>Simulado Estilo FGV - Interpretação</h2>
<div class="busca"><input id="irInput" type="number" min="1" placeholder="Ir para questão (1-20)"><button onclick="irPara()">Ir ➜</button></div>
<div class="bar"><div id="prog"></div></div>
<div class="qnum" id="qnum">Questão 1 de 20</div>
<div class="pergunta" id="pergunta"></div>
<div id="opcoes"></div>
<div class="nav"><button onclick="anterior()">⬅ Anterior</button><button onclick="proxima()">Próxima ➜</button></div>
<div class="final" id="final"></div>
<a class="voltar" href="index.html">⬅ Voltar para o Menu</a>
</div>
<script>
const questoes=[
{q:"Celso, advogado, foi contratado por Maria, servidora pública, para ajuizar ação com pedido de pagamento de gratificação. Contrato prevê que Celso só receberá honorários caso a demanda seja exitosa, em percentual do proveito econômico. É correto afirmar que:",o:["Os honorários contratuais não poderão incidir sobre o valor das parcelas vincendas","Os honorários foram pactuados de forma correta, já que deveriam ser necessariamente representados por pecúnia","Os honorários não podem ser superiores às vantagens advindas a favor de Maria, exceto se acrescidos aos de sucumbência","Os honorários contratuais não poderão incidir sobre o valor das parcelas vencidas"],c:2},
{q:"Roberto, cidadão brasileiro, soube que órgão público federal está contratando empreiteira sem licitação. Quer ajuizar Ação Popular para anular e buscar ressarcimento. Se não obtiver sucesso, quanto a custas e sucumbência:",o:["Não terá que arcar com custas e sucumbência, pois move-se por boa-fé em defesa do interesse público","Somente terá que arcar com custas, mas não sucumbência","Terá que arcar com custas e sucumbência, como ocorre ordinariamente","Não terá nenhum custo, pois a CF isenta custas em todos os remédios constitucionais"],c:0},
{q:"Dois Estados foram atingidos por chuvas, calamidade de grandes proporções. Presidente, após ouvir Conselho da República e Defesa Nacional, decretou estado de defesa, indicando ocupação e uso temporário de bens e serviços públicos dos Estados, sem ressarcimento. Segundo a CF:",o:["Houve violação ao princípio federativo","A medida é constitucional, pois estado de defesa dá poderes amplos por 90 dias","A medida viola a ordem constitucional, pois a União deve responder pelos danos e custos decorrentes","Só seria constitucional com autorização prévia das duas casas do Congresso"],c:2},
{q:"Município Alfa está construindo ponte e precisa utilizar terreno não edificado de Fernando, vizinho à obra, enquanto perdurar atividade de interesse público, sem perigo iminente. A Administração deve:",o:["Realizar tombamento, mediante prévia e justa indenização","Determinar requisição administrativa, mediante indenização ulterior em caso de dano","Efetuar ocupação temporária, passível de indenização pela utilização em ação própria","Implementar servidão administrativa, mediante prévia e justa indenização"],c:2},
{q:"Ana, advogada inscrita na OAB/SP, foi procurada por Pedro, que deseja propor ação contra seu ex-sócio. Pedro propõe pagar os honorários apenas se vencer a causa, mediante contrato de quota litis de 40% sobre o valor recebido. Sobre os honorários de quota litis, assinale a correta:",o:["É vedado em qualquer hipótese","É permitido, desde que o percentual não seja abusivo e não haja aviltamento, observadas as regras do Estatuto","Só é permitido se for 50%","É proibido para ação contra ex-sócio"],c:1},
{q:"Otávio é proprietário de apartamento e causa perturbação aos demais condôminos. Sobre a sanção:",o:["Não pode ser punido por ser proprietário","Síndico pode aplicar multa sem convocar assembleia","Pode ser aplicada multa após deliberação em assembleia, nos termos dos arts. 1.336 e 1.337 do CC","Sanção só pode ser aplicada na via judicial"],c:2},
{q:"Rodolfo e Marília divergem sobre guarda do filho Lorenzo. Sobre guarda compartilhada:",o:["Só é possível se houver acordo","É a regra, mesmo havendo divergência, salvo se um dos genitores declarar que não a deseja","Não pode ser atribuída em caso de conflito","Juiz é obrigado a atribuir a um genitor ou outro"],c:1},
{q:"Márcio vendeu imóvel a João, que registrou. Depois vendeu o mesmo imóvel a Cláudia. Transfere-se propriedade mediante:",o:["Tradição apenas","Contrato apenas","Registro do título translativo no Registro de Imóveis","Posse apenas"],c:2},
{q:"João dirigia e, para remover perigo iminente, deteriorou coisa alheia. Segundo art. 188 CC:",o:["É ato ilícito sempre","Não constitui ato ilícito a deterioração para remover perigo iminente","Deve indenizar sempre","Houve ato ilícito porque não avisou"],c:1},
{q:"Túlio e Alfredo combinaram roubo à joalheria. Alfredo com arma exige que Fernanda abra vitrine. Túlio fica na porta vigiando. Sobre condutas:",o:["Só Alfredo responde","Ambos respondem por roubo, pois houve divisão de tarefas e unidade de desígnios","Só Túlio responde","Nenhum responde porque não levaram nada"],c:1},
{q:"Elias, reincidente específico em tráfico, foi flagrado vendendo um pino de cocaína e trazendo consigo outros pinos. Sobre art. 33 Lei 11.343/06:",o:["Responde por dois crimes em concurso formal","Responde por um único crime, pois vender e trazer consigo são verbos do mesmo tipo, de ação múltipla","Não responde porque é usuário","Responde por tráfico e uso em concurso"],c:1},
{q:"João da Silva se submeteu em novembro/2021 a processo seletivo para banco privado. Sobre jornada:",o:["Jornada normal é 8h diárias e 44h semanais","Jornada é 6h diárias para todos","Pode trabalhar 12h sem intervalo","Não há limite de jornada"],c:0},
{q:"Na petição inicial, o autor deve indicar:",o:["Apenas nome do autor","Juízo, partes, fato, fundamento, pedido, valor da causa, provas e opção por audiência","Apenas sentença esperada","Somente endereço do réu"],c:1},
{q:"Sobre embriaguez completa decorrente de caso fortuito ou força maior, art. 28 §1º CP:",o:["Não exclui imputabilidade","Exclui a imputabilidade","Aumenta a pena","É causa de aumento apenas"],c:1},
{q:"Martinez, estrangeiro residente no Brasil, quer ser professor universitário. Segundo CF art. 207 §1º:",o:["É proibido estrangeiro ser professor","É facultado às universidades admitir professores estrangeiros, na forma da lei","Exige naturalização prévia","Exige 4 anos de residência"],c:1},
{q:"Advogada Carolina faz publicidade irregular e estagiária Beatriz também. Sobre TAC:",o:["Não cabe TAC","É admitida celebração de TAC no âmbito do Conselho Federal ou Seccionais para fazer cessar publicidade","Só cabe para Carolina","Só cabe para estagiária"],c:1},
{q:"Sobre consórcio de empresas e responsabilidade perante consumidores:",o:["Só uma responde","As consorciadas respondem solidariamente, nos termos da lei","Nenhuma responde","Só responde se houver culpa provada de cada uma"],c:1},
{q:"Sobre ato administrativo, são atributos:",o:["Presunção de legitimidade, imperatividade e autoexecutoriedade","Apenas moralidade","Somente publicidade","Nenhum atributo"],c:0},
{q:"Perícia produzida no inquérito civil ou juízo cível pode ser aproveitada no processo penal?",o:["Não, nunca","Sim, instaurando-se o contraditório - art. 19, parágrafo único, Lei 9.605/98","Sim, sem contraditório","Só se for criminal"],c:1},
{q:"João Paulo, Thiago e outros formam associação para fins não econômicos. É correto:",o:["Associação não pode desenvolver atividade econômica","Associação pode desenvolver atividade econômica, desde que sem finalidade lucrativa e valores revertidos para ela","Fundação é união de pessoas","Associação é complexo de bens"],c:1},
];
let atual=0, acertos=0, respondidas=new Set();
function mostrar(){
document.getElementById('qnum').innerText=`Questão ${atual+1} de ${questoes.length}`;
document.getElementById('pergunta').innerText=questoes[atual].q;
document.getElementById('prog').style.width=((atual+1)/questoes.length*100)+'%';
const div=document.getElementById('opcoes'); div.innerHTML='';
questoes[atual].o.forEach((alt,i)=>{
const d=document.createElement('div'); d.className='opcao'; d.innerText=String.fromCharCode(65+i)+") "+alt;
d.onclick=()=>{ if(d.dataset.ok) return; d.dataset.ok=1;
if(i===questoes[atual].c){ d.classList.add('certa'); if(!respondidas.has(atual)){acertos++; respondidas.add(atual);} }
else{ d.classList.add('errada'); div.children[questoes[atual].c].classList.add('certa'); respondidas.add(atual); }
document.getElementById('acertos').innerText=`Acertos: ${acertos}`;
if(respondidas.size===questoes.length) document.getElementById('final').innerText=`Fim! Você acertou ${acertos} de ${questoes.length} 🎉`;
};
div.appendChild(d);
});
}
function proxima(){ if(atual<questoes.length-1){atual++; mostrar();} }
function anterior(){ if(atual>0){atual--; mostrar();} }
function irPara(){ let v=parseInt(document.getElementById('irInput').value); if(v>=1 && v<=questoes.length){atual=v-1; mostrar();} }
mostrar();
</script>
</body>
</html>
